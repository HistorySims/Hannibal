<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Cannae</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-user-select:none;}
html,body{
  background:#1a1a1a;
  height:100dvh;width:100%;
  display:flex;align-items:center;justify-content:center;
  font-family:system-ui,sans-serif;
  overflow:hidden;
}
#game{position:relative;width:100%;height:100%;max-width:700px;background:#b8a878;}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;}

.hud{
  position:absolute;top:8px;left:0;width:100%;
  display:flex;flex-direction:column;align-items:center;
  pointer-events:none;z-index:10;
}
.counts{font-size:14px;font-weight:700;text-shadow:0 1px 3px #000;}
.rom{color:#ef4444}.car{color:#60a5fa}
.phase-text{
  margin-top:6px;font-size:11px;color:#fff;opacity:0.7;
  text-transform:uppercase;letter-spacing:1px;
}
.msg{
  position:absolute;top:20%;left:50%;transform:translateX(-50%);
  font-size:28px;font-weight:900;color:#fff;
  text-shadow:0 2px 8px #000;
  opacity:0;transition:opacity 0.4s;
  pointer-events:none;z-index:20;
}

.controls{
  position:absolute;bottom:20px;left:20px;
  display:grid;grid-template-columns:repeat(3,44px);gap:6px;
  z-index:10;
}
.btn{
  width:44px;height:44px;border-radius:10px;
  background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);
  color:#fff;font-size:16px;font-weight:700;
  display:flex;align-items:center;justify-content:center;
}
.btn:active{background:rgba(255,255,255,0.3);}
.spacer{opacity:0;}

.attack-btn{
  position:absolute;bottom:30px;right:30px;
  width:70px;height:70px;border-radius:50%;
  background:#f59e0b;border:3px solid #fff;
  font-size:28px;z-index:10;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 0 #b45309;
}
.attack-btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b45309;}

#overlay{
  position:absolute;inset:0;background:rgba(0,0,0,0.92);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:100;padding:20px;text-align:center;
}
#overlay h1{color:#f59e0b;font-size:36px;margin-bottom:10px;}
#overlay p{color:#ccc;font-size:14px;max-width:320px;line-height:1.5;margin-bottom:15px;}
.start-btn{
  background:#ef4444;color:#fff;border:none;
  padding:14px 28px;font-size:16px;font-weight:700;
  border-radius:8px;box-shadow:0 4px 0 #991b1b;
}
.start-btn:active{transform:translateY(4px);box-shadow:none;}
.alt-btn{background:#475569;box-shadow:0 4px 0 #1e293b;margin-top:10px;}
</style>
</head>
<body>
<div id="game">
  <div id="overlay">
    <h1>CANNAE</h1>
    <p>216 BC. You command a century in the Roman center. 86,000 men at your back. The Carthaginians await.</p>
    <p style="color:#f59e0b;font-weight:700;">Push forward. Break their line. Win the war.</p>
    <button class="start-btn" onclick="startGame()">ADVANCE</button>
    <button class="start-btn alt-btn" onclick="showHistory()">THE HISTORY</button>
  </div>

  <div class="hud">
    <div class="counts">
      <span class="rom">ROME: <span id="romeCount">0</span></span>
      &nbsp;&nbsp;
      <span class="car">CARTHAGE: <span id="carCount">0</span></span>
    </div>
    <div class="phase-text" id="phaseText">ADVANCE</div>
  </div>

  <div class="msg" id="msg"></div>
  <canvas id="cv"></canvas>

  <div class="controls">
    <div class="spacer"></div>
    <div class="btn" data-dir="0,-1">▲</div>
    <div class="spacer"></div>
    <div class="btn" data-dir="-1,0">◀</div>
    <div class="spacer"></div>
    <div class="btn" data-dir="1,0">▶</div>
    <div class="spacer"></div>
    <div class="btn" data-dir="0,1">▼</div>
    <div class="spacer"></div>
  </div>

  <div class="attack-btn" id="atkBtn">⚔</div>
</div>

<script>
const C = document.getElementById('cv');
const X = C.getContext('2d');
const game = document.getElementById('game');

// Grid
const T = 20; // tile size
const W = 40; // grid width
const H = 50; // grid height

// State
let running = false;
let grid, units, player, cam, phase, tick;
let input = {dx:0, dy:0};
let atkCooldown = 0;
let msgTimeout = null;

// Phases
const PHASE = {
  MARCH: 0,      // Moving toward enemy
  CONTACT: 1,    // Fighting begins
  BREAKING: 2,   // "They're retreating!" - center gives
  TRAPPED: 3,    // Flanks close, movement restricted
  CRUSHED: 4     // Endgame - compression damage
};

const phaseNames = ['ADVANCE','CONTACT','THEY RETREAT!','FLANKS CLOSING','CRUSHED'];

// ============ SETUP ============
function startGame(){
  document.getElementById('overlay').style.display = 'none';
  running = true;
  phase = PHASE.MARCH;
  tick = 0;
  atkCooldown = 0;

  grid = [];
  for(let y=0;y<H;y++){
    grid[y] = [];
    for(let x=0;x<W;x++) grid[y][x] = null;
  }
  units = [];

  const cx = Math.floor(W/2);
  const cy = Math.floor(H/2) + 12;

  // Player at front of Roman formation
  player = spawn(cx, cy - 3, 'player');
  cam = {x: player.x * T, y: player.y * T};

  // Romans - tight block behind player
  for(let y = cy - 3; y <= cy + 5; y++){
    for(let x = cx - 6; x <= cx + 6; x++){
      if(!grid[y][x] && Math.random() < 0.8){
        spawn(x, y, 'roman');
      }
    }
  }

  // Carthaginian crescent - CENTER FORWARD, wings back
  const enemyLine = cy - 12;
  for(let x = cx - 14; x <= cx + 14; x++){
    const dist = Math.abs(x - cx);
    // Center bulges forward (lower y), wings hang back (higher y)
    const curve = Math.floor(dist * dist / 30);
    const row = enemyLine + curve;

    // 2-3 deep
    const depth = dist < 4 ? 3 : 2;
    for(let d = 0; d < depth; d++){
      const y = row + d;
      if(y > 0 && y < H && !grid[y][x]){
        const u = spawn(x, y, 'enemy');
        u.role = dist < 5 ? 'center' : 'wing';
        u.startY = y;
      }
    }
  }

  resize();
  loop();
}

function spawn(x, y, type){
  if(grid[y][x]) return null;
  const u = {
    x, y, type,
    hp: type === 'player' ? 100 : type === 'roman' ? 8 : 10,
    maxHp: type === 'player' ? 100 : type === 'roman' ? 8 : 10,
    cd: 0,
    role: null,
    startY: y
  };
  grid[y][x] = u;
  units.push(u);
  return u;
}

// ============ MAIN LOOP ============
function loop(){
  if(!running) return;
  tick++;
  update();
  draw();
  requestAnimationFrame(loop);
}

function update(){
  if(!player || player.hp <= 0){
    gameOver();
    return;
  }

  // Cooldowns
  if(atkCooldown > 0) atkCooldown--;

  // Update phase based on position and situation
  updatePhase();

  // Update all units
  for(const u of units){
    if(u.hp <= 0) continue;
    if(u.cd > 0){ u.cd--; continue; }

    if(u.type === 'player'){
      movePlayer(u);
    } else {
      moveAI(u);
    }
  }

  // Remove dead
  for(const u of units){
    if(u.hp <= 0 && grid[u.y][u.x] === u){
      grid[u.y][u.x] = null;
    }
  }
  units = units.filter(u => u.hp > 0);

  // Camera follow
  cam.x += (player.x * T - cam.x) * 0.1;
  cam.y += (player.y * T - cam.y) * 0.1;

  // Update HUD
  document.getElementById('romeCount').textContent = units.filter(u=>u.type!=='enemy').length;
  document.getElementById('carCount').textContent = units.filter(u=>u.type==='enemy').length;
  document.getElementById('phaseText').textContent = phaseNames[phase];
}

function updatePhase(){
  const cx = Math.floor(W/2);
  const enemies = units.filter(u => u.type === 'enemy');
  const nearbyEnemies = enemies.filter(u => Math.abs(u.x - player.x) < 3 && Math.abs(u.y - player.y) < 3);

  // Count how surrounded player is
  let surrounded = 0;
  for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
      if(dx===0&&dy===0)continue;
      const tx=player.x+dx, ty=player.y+dy;
      if(grid[ty]&&grid[ty][tx]) surrounded++;
    }
  }

  if(phase === PHASE.MARCH){
    // Contact when we reach enemies
    if(nearbyEnemies.length > 0){
      phase = PHASE.CONTACT;
      showMsg("CONTACT!");
    }
  }

  if(phase === PHASE.CONTACT){
    // Breaking when player pushes past original enemy line
    const centerEnemies = enemies.filter(u => u.role === 'center');
    const avgCenterY = centerEnemies.reduce((s,u)=>s+u.y,0) / (centerEnemies.length||1);
    if(player.y < avgCenterY - 2){
      phase = PHASE.BREAKING;
      showMsg("THEY'RE BREAKING!", "#22c55e");
      // Mark center units to retreat
      for(const u of centerEnemies){
        u.retreating = true;
      }
    }
  }

  if(phase === PHASE.BREAKING){
    // Trapped when wings start closing
    const wings = enemies.filter(u => u.role === 'wing');
    const wingsAdvanced = wings.filter(u => u.y > u.startY + 3).length;
    if(wingsAdvanced > wings.length * 0.3){
      phase = PHASE.TRAPPED;
      showMsg("THE FLANKS!", "#fbbf24");
    }
  }

  if(phase === PHASE.TRAPPED){
    // Crushed when fully surrounded
    if(surrounded >= 6){
      phase = PHASE.CRUSHED;
      showMsg("NO ESCAPE", "#ef4444");
    }
  }

  // Crush damage in final phase
  if(phase === PHASE.CRUSHED && surrounded >= 6){
    if(tick % 20 === 0){
      player.hp -= 2;
      floatText(player.x, player.y, "CRUSH", "#ef4444");
    }
  }
}

// ============ PLAYER ============
function movePlayer(u){
  if(input.dx === 0 && input.dy === 0) return;

  const tx = u.x + input.dx;
  const ty = u.y + input.dy;

  if(tx < 0 || tx >= W || ty < 0 || ty >= H) return;
  if(grid[ty][tx]) return; // blocked

  // Movement cost increases when trapped
  let cost = 12;
  if(phase >= PHASE.TRAPPED){
    // Count adjacent units - more = slower
    let adj = 0;
    for(let dy=-1;dy<=1;dy++){
      for(let dx=-1;dx<=1;dx++){
        if(grid[u.y+dy]&&grid[u.y+dy][u.x+dx]) adj++;
      }
    }
    cost = 12 + adj * 3;
  }

  grid[u.y][u.x] = null;
  u.x = tx; u.y = ty;
  grid[ty][tx] = u;
  u.cd = cost;
}

// ============ AI ============
function moveAI(u){
  const cx = Math.floor(W/2);

  // Find target
  let target = null, minD = 999;
  for(const o of units){
    if(o.type === 'enemy') continue;
    const d = Math.abs(o.x-u.x) + Math.abs(o.y-u.y);
    if(d < minD){ minD = d; target = o; }
  }

  // Attack if adjacent
  if(target && minD === 1){
    attack(u, target);
    u.cd = 30 + Math.random() * 20;
    return;
  }

  let mx = 0, my = 0;

  if(u.type === 'enemy'){
    // CENTER: Fight, then GIVE GROUND when breaking
    if(u.role === 'center'){
      if(u.retreating && phase >= PHASE.BREAKING){
        // Retreat! But fight back sometimes
        if(Math.random() < 0.4){
          my = 1; // step back
        } else if(target && minD < 4){
          mx = Math.sign(target.x - u.x);
          my = Math.sign(target.y - u.y);
        }
      } else if(target && minD < 5){
        mx = Math.sign(target.x - u.x);
        my = Math.sign(target.y - u.y);
      }
    }

    // WINGS: Hold, then FLANK
    else if(u.role === 'wing'){
      if(phase >= PHASE.BREAKING){
        // Advance south to get behind Romans
        if(u.y < player.y + 4){
          my = 1;
        } else {
          // Curve inward
          mx = u.x < cx ? 1 : -1;
        }
      } else if(target && minD < 3){
        mx = Math.sign(target.x - u.x);
        my = Math.sign(target.y - u.y);
      }
    }
  }

  // Romans: advance with player
  else if(u.type === 'roman'){
    if(target && minD < 6){
      mx = Math.sign(target.x - u.x);
      my = Math.sign(target.y - u.y);
    } else {
      // Follow player
      mx = Math.sign(player.x - u.x);
      my = Math.sign(player.y - u.y);
    }
  }

  // Execute move
  if(mx !== 0 || my !== 0){
    // Prefer primary direction
    if(Math.abs(mx) >= Math.abs(my)) my = 0;
    else mx = 0;

    const tx = u.x + mx;
    const ty = u.y + my;
    if(tx >= 0 && tx < W && ty >= 0 && ty < H && !grid[ty][tx]){
      grid[u.y][u.x] = null;
      u.x = tx; u.y = ty;
      grid[ty][tx] = u;
    }
  }

  u.cd = 20 + Math.random() * 15;
}

// ============ COMBAT ============
function attack(attacker, defender){
  const dmg = attacker.type === 'player' ? 4 : 2;
  defender.hp -= dmg;
  floatText(defender.x, defender.y, "-" + dmg, "#fff");

  if(defender.hp <= 0){
    floatText(defender.x, defender.y, "KILL", "#f59e0b");
  }
}

function playerAttack(){
  if(atkCooldown > 0) return;
  atkCooldown = 15;

  // Attack all adjacent enemies
  let hit = false;
  for(let dy=-1;dy<=1;dy++){
    for(let dx=-1;dx<=1;dx++){
      if(dx===0&&dy===0)continue;
      const tx=player.x+dx, ty=player.y+dy;
      if(grid[ty]&&grid[ty][tx]&&grid[ty][tx].type==='enemy'){
        attack(player, grid[ty][tx]);
        hit = true;
      }
    }
  }
  if(!hit){
    floatText(player.x, player.y, "MISS", "#888");
  }
}

// ============ VISUALS ============
let floats = [];
function floatText(x, y, text, color){
  floats.push({x: x*T, y: y*T, text, color, life: 1});
}

function showMsg(text, color = "#fff"){
  const el = document.getElementById('msg');
  el.textContent = text;
  el.style.color = color;
  el.style.opacity = 1;
  clearTimeout(msgTimeout);
  msgTimeout = setTimeout(() => el.style.opacity = 0, 2000);
}

function draw(){
  X.fillStyle = '#b8a878';
  X.fillRect(0, 0, C.width, C.height);

  X.save();
  X.translate(C.width/2 - cam.x, C.height/2 - cam.y);

  // Grid
  X.strokeStyle = 'rgba(0,0,0,0.1)';
  X.lineWidth = 1;
  for(let x=0;x<=W;x++){
    X.beginPath(); X.moveTo(x*T,0); X.lineTo(x*T,H*T); X.stroke();
  }
  for(let y=0;y<=H;y++){
    X.beginPath(); X.moveTo(0,y*T); X.lineTo(W*T,y*T); X.stroke();
  }

  // Units
  for(const u of units){
    if(u.hp <= 0) continue;

    let color;
    if(u.type === 'player') color = '#22c55e';
    else if(u.type === 'roman') color = '#ef4444';
    else color = '#3b82f6';

    X.fillStyle = color;
    X.fillRect(u.x*T+2, u.y*T+2, T-4, T-4);

    // Health bar for player
    if(u.type === 'player'){
      X.fillStyle = '#000';
      X.fillRect(u.x*T, u.y*T-6, T, 4);
      X.fillStyle = '#22c55e';
      X.fillRect(u.x*T, u.y*T-6, T * (u.hp/u.maxHp), 4);
    }
  }

  // Float text
  X.font = 'bold 10px sans-serif';
  X.textAlign = 'center';
  for(const f of floats){
    X.fillStyle = f.color;
    X.globalAlpha = f.life;
    X.fillText(f.text, f.x + T/2, f.y);
    f.y -= 0.5;
    f.life -= 0.02;
  }
  X.globalAlpha = 1;
  floats = floats.filter(f => f.life > 0);

  X.restore();
}

function resize(){
  C.width = game.clientWidth;
  C.height = game.clientHeight;
}
window.addEventListener('resize', resize);

// ============ INPUT ============
document.querySelectorAll('.btn[data-dir]').forEach(btn => {
  const [dx, dy] = btn.dataset.dir.split(',').map(Number);
  btn.addEventListener('pointerdown', e => {
    e.preventDefault();
    input.dx = dx; input.dy = dy;
  });
  btn.addEventListener('pointerup', () => { input.dx = 0; input.dy = 0; });
  btn.addEventListener('pointerleave', () => { input.dx = 0; input.dy = 0; });
});

document.getElementById('atkBtn').addEventListener('pointerdown', e => {
  e.preventDefault();
  playerAttack();
});

window.addEventListener('keydown', e => {
  if(e.key === 'ArrowUp' || e.key === 'w') input.dy = -1;
  if(e.key === 'ArrowDown' || e.key === 's') input.dy = 1;
  if(e.key === 'ArrowLeft' || e.key === 'a') input.dx = -1;
  if(e.key === 'ArrowRight' || e.key === 'd') input.dx = 1;
  if(e.key === ' ') playerAttack();
});
window.addEventListener('keyup', e => {
  if(e.key === 'ArrowUp' || e.key === 'w' || e.key === 'ArrowDown' || e.key === 's') input.dy = 0;
  if(e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'ArrowRight' || e.key === 'd') input.dx = 0;
});

// ============ GAME OVER ============
function gameOver(){
  running = false;
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h1 style="color:#ef4444">DEFEAT</h1>
    <p>You were crushed in the press. Most Romans at Cannae didn't die fighting - they died because they couldn't raise their swords.</p>
    <p style="color:#f59e0b;font-weight:700;">Space is survival. You traded space for kills.</p>
    <button class="start-btn" onclick="startGame()">TRY AGAIN</button>
    <button class="start-btn alt-btn" onclick="location.href='map.html'">RETURN TO MAP</button>
    <button class="start-btn alt-btn" onclick="showHistory()">THE HISTORY</button>
  `;
}

function showHistory(){
  const overlay = document.getElementById('overlay');
  overlay.style.display = 'flex';
  overlay.innerHTML = `
    <h1 style="color:#f59e0b">CANNAE</h1>
    <p style="text-align:left;font-size:13px;">
      <b>August 2, 216 BC</b><br><br>
      Hannibal faced 86,000 Romans with only 50,000 men. He formed his infantry in a crescent, center forward.<br><br>
      The Romans pushed into the center, which slowly gave ground. They thought they were winning.<br><br>
      Meanwhile, Hannibal's wings held firm. As the center retreated, the wings advanced, curving inward. His cavalry swept behind.<br><br>
      The Romans were packed so tight they couldn't swing their swords. 50,000-70,000 died - most from crushing, not combat.<br><br>
      <b style="color:#ef4444">It remains the deadliest single day in military history.</b>
    </p>
    <button class="start-btn" onclick="startGame()" style="margin-top:15px;">EXPERIENCE IT</button>
    <button class="start-btn alt-btn" onclick="location.href='map.html'">RETURN TO MAP</button>
  `;
}
</script>
</body>
</html>
