<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Zama: The Way</title>
<style>
    body {
        margin: 0; padding: 0; background: #000;
        /* Changed to auto height to allow scrolling if screen is too short */
        min-height: 100vh; 
        display: flex; align-items: center; justify-content: center;
        font-family: 'Courier New', Courier, monospace; 
    }
    #stage {
        /* Changed to Flex Column layout */
        display: flex;
        flex-direction: column;
        position: relative; width: 100%; max-width: 800px; 
        /* Removed fixed aspect-ratio for the container */
        background: #1a1a1c; 
        border: 2px solid #555;
        box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    canvas { 
        display: block; width: 100%; 
        /* Enforce the 4:3 aspect ratio on the canvas element itself */
        aspect-ratio: 4/3;
        image-rendering: pixelated; 
        flex-shrink: 0;
    }
    
    /* DIALOGUE BOX - positioned below canvas */
    #dialogue-box {
        position: relative; /* No longer absolute */
        width: 100%; background: #111; 
        border-top: 4px solid #1f9d55;
        padding: 20px; display: none; z-index: 30;
        cursor: pointer; 
        height: 150px; /* Fixed height for text area */
        box-sizing: border-box;
        flex-shrink: 0;
    }
    .speaker-name {
        color: #1f9d55; font-weight: 900; font-size: 16px; text-transform: uppercase;
        margin-bottom: 10px; letter-spacing: 2px;
    }
    .speech-text {
        color: #e7e7ea; font-size: 18px; line-height: 1.4; white-space: pre-wrap;
    }
    .click-prompt {
        position: absolute; bottom: 10px; right: 20px;
        font-size: 12px; color: #fbbf24; animation: blink 1s infinite;
    }

    /* TITLE SCREEN - Covers entire stage (canvas + text box) */
    #title-screen {
        position: absolute; inset: 0; 
        background: #d4a373; 
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 50; text-align: center;
        opacity: 0; transition: opacity 2s;
    }
    h1 { 
        font-size: 64px; color: #b91c1c; margin: 0; 
        text-transform: uppercase; letter-spacing: 4px; 
        text-shadow: 0 4px 0 #000;
    }
    h2 { font-size: 18px; color: #111; margin-bottom: 30px; letter-spacing: 2px; font-weight:800; }
    
    button {
        background: #1e3a8a; color: #fff; border: 4px solid #fff;
        padding: 15px 40px; font-size: 20px; font-weight: 900; cursor: pointer;
        text-transform: uppercase; 
        box-shadow: 0 6px 0 #000;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }

    @keyframes blink { 50% { opacity: 0; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boot.css">
</head>
<body>

<div id="stage">
    <canvas id="cv"></canvas>
    
    <div id="dialogue-box" onclick="nextLine()">
        <div class="speaker-name">Scipio Africanus</div>
        <div class="speech-text" id="speech"></div>
        <div class="click-prompt">TAP TO CONTINUE ▼</div>
    </div>

    <div id="title-screen">
        <h1>ZAMA</h1>
        <h2>The Final Battle</h2>
        <button onclick="window.location.href='zama_game.html'">Strike</button>
        <button onclick="window.location.href='map.html'" style="margin-top:15px; background:#475569; box-shadow:0 4px 0 #334155;">Back to Map</button>
    </div>
</div>

<script src="controls.js"></script>
<script src="pixel.js"></script>
<script src="scene.js"></script>
<script>
const SCRIPT = [
    { scene: 'scipio',       mood: 'neutral', text: "The elephant is a weapon of terror. Soldiers break ranks because they are afraid." },
    { scene: 'scipio',       mood: 'grim',    text: "But Rome's problem has never been a lack of courage." },
    { scene: 'flash_trebia', mood: 'grim',    text: "At the Trebia... we stood our ground in the freezing river. We did not run." },
    { scene: 'flash_cannae', mood: 'grim',    text: "At Cannae... we held the circle tight. We died shoulder to shoulder, facing the enemy." },
    { scene: 'wall',         mood: 'grim',    text: "It is brave to stand before a charging beast. But courage alone just gets you trampled." },
    { scene: 'lane',         mood: 'neutral', text: "To defeat the charge, you must not be a wall. You must be a path." },
    { scene: 'lane',         mood: 'neutral', text: "You step aside. You let it go exactly where it wants to go. Then... you strike." },
    { scene: 'fleet',        mood: 'neutral', text: "That is why we came here, to Africa. We did not chase Hannibal." },
    { scene: 'zama',         mood: 'grim',    text: "We gave him a path to where we wanted him to be. And now..." },
    { scene: 'zama_horse',   mood: 'grim',    text: "And this time, Masinissa's Numidian horse ride with Rome." },
    { scene: 'zama_scipio',  mood: 'grim',    text: "We end him." }
];

function palm(x, y){
    for(let i=0; i<26; i++) SCENE.rect(x + Math.round(Math.sin(i/9)*3), y - i, 3, 1, i%3 ? '#7a5434' : '#5a3a20');
    const tx = x + Math.round(Math.sin(25/9)*3) + 1, ty = y - 26, sway = Math.round(Math.sin(PX.t/40));
    for(const [dx, dy] of [[-10,4],[-7,2],[-4,0],[4,0],[7,2],[10,4],[0,-3]]){
        for(let k=0; k<6; k++) SCENE.rect(tx + Math.round(dx*k/6) + sway, ty + Math.round(dy*k/6) + Math.floor(k*k/10), 2, 1, k > 3 ? '#4a7a2a' : '#5a9a34');
    }
}

// Scipio's camp in Africa
function drawScipio(mood){
    SCENE.sky([[0,'#3a6ab0'],[30,'#6a94c8'],[56,'#c8c8b8'],[70,'#e8c890']]);
    SCENE.hills(84, [6,8,12,10,8,6,4,6,8,10,8,6,4,4,6,8,6], '#c89a60', '#dab07a');
    PX.ground(16, 20, (x, y) => y*8 >= 84 ? 'sand' : null);
    for(let i=0; i<5; i++) PX.pic('tent', (8 + i*26)/8 - 0.5, (88 + (i%2)*4)/8 - 1);
    palm(14, 108); palm(112, 104);
    PX.pic('standard', 32/8 - 0.5, 100/8 - 1); PX.pic('standard', 92/8 - 0.5, 100/8 - 1);
    SCENE.portrait('scipio', mood);
}

// Memory of the Trebia, in icy blue
function drawFlashTrebia(){
    SCENE.riverCrossing();
    SCENE.tint('rgba(18,40,96,0.45)');
}

// Memory of Cannae: the legions crushed inside a ring of enemies, in red
function drawFlashCannae(){
    PX.ground(16, 20, () => 'plain');
    const t = PX.t, pts = [];
    const squeeze = 1 + Math.sin(t/40) * 0.04;
    for(let a=0; a<26; a++){
        const ang = a/26 * Math.PI*2;
        pts.push({ x: 60 + Math.cos(ang)*48*squeeze, y: 76 + Math.sin(ang)*44*squeeze, k: a%3 === 0 ? 'libyan' : 'gaul', back: Math.sin(ang) > 0 });
    }
    for(let r=0; r<7; r++) for(let c=0; c<7; c++){
        const x = 32 + c*9 + (r%2)*4, y = 50 + r*8;
        if(((x - 60)**2)/(34*34) + ((y - 76)**2)/(30*30) < 1) pts.push({ x, y, k:'roman', back: r < 3 });
    }
    pts.sort((a, b) => a.y - b.y);
    for(const p of pts) PX.figure(p.k, p.x, p.y, { back: p.back });
    SCENE.tint('rgba(110,8,8,0.45)');
}

// An elephant charge into a solid line: the line is smashed
function drawWall(){
    PX.ground(16, 20, () => 'sand');
    const t = SCENE.since() % 160;
    const ey = 18 + Math.min(t, 70) * 1.0;
    const hit = t > 64;
    for(let r=0; r<2; r++) for(let c=0; c<13; c++){
        const x = 2 + c*10, y = 104 + r*9;
        if(hit && r === 0 && Math.abs(x - 58) < 20){
            const fly = Math.min(1, (t - 64)/20);
            PX.figure('roman', x + Math.sign(x - 58)*fly*22, y - Math.sin(fly*Math.PI)*16, { back:true, flash: t < 72 });
        } else PX.figure('roman', x, y, { back:true });
    }
    PX.figure('elephant', 58, ey, { face: 1, frame: Math.floor(t/6) % 2 });
    if(hit && t < 76) SCENE.rect(0, 0, 128, 160, 'rgba(255,255,255,0.25)');
    if(hit) PX.label('TRAMPLED', 7.6, 11, '#ef4444');
}

// The same charge into a line with a lane: it passes harmlessly, and is struck from the side
function drawLane(){
    PX.ground(16, 20, (x) => (x >= 6 && x <= 8) ? 'sandLane' : 'sand');
    const t = SCENE.since() % 170;
    const ey = 18 + t * 0.9;
    const passing = ey > 88 && ey < 124;
    for(let r=0; r<2; r++) for(let c=0; c<13; c++){
        const x = 2 + c*10, y = 104 + r*9;
        if(x >= 46 && x <= 66) continue;                              // the lane
        const near = passing && (x === 42 || x === 72);
        PX.figure('roman', x + (near ? (x < 64 ? 3 : -3) : 0), y, { back:true, lunge: near });
    }
    PX.figure('elephant', 54, ey, { face: 1, frame: Math.floor(t/6) % 2, flash: passing && t % 12 < 3 });
}

// The fleet sails for Africa
function drawFleet(){
    SCENE.sky([[0,'#4a86c8'],[40,'#7aa8d8'],[60,'#b8d0e4']]);
    for(const [x, y, w] of [[10,14,24],[60,8,30],[96,22,20]]){ const cx = (x + PX.t*0.05) % 150 - 10; SCENE.rect(cx, y, w, 4, '#eef4fa'); SCENE.rect(cx + 4, y - 3, w - 8, 3, '#eef4fa'); }
    SCENE.water(64, 96, '#1e4a8a', '#6a98d0');
    SCENE.rect(112, 58, 16, 8, '#d8b07a');                           // the coast of Africa
    for(const [x, y] of [[0, 70], [40, 92], [8, 118], [56, 132]]){
        SCENE.ship((x + PX.t*0.12) % 150 - 20, y, { stripe:'#c03028' });
    }
}

// The field at Zama: elephants and three lines facing Scipio's maniples, lanes open
function drawZama(horse){
    PX.ground(16, 20, (x, y) => (y >= 10 && (x === 3 || x === 8 || x === 13)) ? 'sandLane' : 'sand');
    for(let c=0; c<14; c++) PX.figure('veteran', 2 + c*9, 2, {});
    for(let c=0; c<14; c++) PX.figure(c%2 ? 'levy' : 'merc', 6 + c*9, 14, {});
    for(const x of [10, 34, 58, 82, 106]) PX.figure('elephant', x, 34 + (x%3)*2, { face: x < 64 ? 1 : -1, frame: Math.floor(PX.t/12)%2 });
    for(let r=0; r<4; r++) for(let c=0; c<16; c++){
        if(c === 3 || c === 8 || c === 13) continue;                  // Scipio's lanes
        PX.figure(r === 3 ? 'triarii' : 'roman', c*8, 96 + r*12, { back:true });
    }
    for(let i=0; i<3; i++) PX.figure('velite', 3*8 + 0, 84 - i*4, { back:true });
    if(horse){
        const t = SCENE.since();
        for(let i=0; i<6; i++) PX.figure('numid', 138 - Math.min(t, 90)*0.4 - i*9 + (i%2)*4, 64 + (i%3)*9, { face:-1, frame: Math.floor((PX.t + i*3)/5) % 2 });
    }
}
function drawZamaScipio(mood){
    drawZama(true);
    SCENE.rect(0, 0, 128, 160, 'rgba(0,0,0,0.3)');
    SCENE.portrait('scipio', mood);
}

SCENE.run({
    script: SCRIPT,
    speakers: { scipio: { label: 'Scipio Africanus', color: '#4ade80' } },
    speaker: 'scipio',
    draw: (L) => {
        switch(L.scene){
            case 'scipio': return drawScipio(L.mood);
            case 'flash_trebia': return drawFlashTrebia();
            case 'flash_cannae': return drawFlashCannae();
            case 'wall': return drawWall();
            case 'lane': return drawLane();
            case 'fleet': return drawFleet();
            case 'zama': return drawZama(false);
            case 'zama_horse': return drawZama(true);
            default: return drawZamaScipio(L.mood);
        }
    }
});
</script>
</body>
</html>
