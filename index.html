<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Hannibal: The Second Punic War</title>
<style>
  html, body { margin:0; height:100%; background:#0b0b0c; overflow:hidden; touch-action:manipulation; }
  #stage { position:relative; }
  #dialogue-box { cursor:pointer; user-select:none; -webkit-user-select:none; }
  .speaker-name { color:#fbbf24; }
  #title-screen {
    position:absolute; inset:0; display:none; opacity:0; transition:opacity 1.5s;
    flex-direction:column; align-items:center; justify-content:center; text-align:center; z-index:50;
    background:radial-gradient(circle at 50% 40%, #3a1a1a 0%, #0b0b0c 75%);
  }
  #title-screen h1 { color:#fbbf24; }
  #title-screen h2 { color:#e7e5e4; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boot.css">
</head>
<body>

<div id="stage">
    <canvas id="cv"></canvas>

    <div id="dialogue-box" onclick="nextLine()">
        <div class="speaker-name" id="speaker">241 BC</div>
        <div class="speech-text" id="speech"></div>
        <div class="click-prompt">TAP TO CONTINUE ▼</div>
    </div>

    <div id="title-screen">
        <h1>HANNIBAL</h1>
        <h2>The Second Punic War<br>218 - 202 BC</h2>
        <button onclick="window.location.href='map.html'">Begin the Campaign</button>
    </div>
</div>

<script src="pixel.js"></script>
<script src="scene.js"></script>
<script>
// The opening, chapter by chapter; each paragraph is shown one sentence group at a time
const CHAPTERS = [
  { id:'c1', label:'241 BC', scene:'med', text:"It is a dangerous moment for the western Mediterranean.\n\nCarthage dominates trade with ships and silver. But Rome has risen.\n\nVictory has changed everything." },
  { id:'c2', label:'241 BC, the Aegates Islands', scene:'sea', text:"Rome broke Carthage’s fleets and seized the sea. Carthaginian ships burned.\n\nCarthage survived, but emerged weakened and burdened by debt." },
  { id:'c3', label:'237 BC, Iberia', scene:'iberia', text:"One commander refused to accept defeat.\n\nHamilcar Barca carried the war to Iberia, rebuilding strength far from Rome’s reach." },
  { id:'c4', label:'237 BC, the oath', scene:'oath', text:"Before an altar, Hamilcar bound his son to hatred.\n\nThe boy’s name was Hannibal. He swore never to be a friend to Rome." },
  { id:'c5', label:'221 BC, New Carthage', scene:'army', text:"Years passed. Hannibal grew into command.\n\nIn Spain, an army gathered: veterans, cavalry, and elephants. Rome watched from afar." },
  { id:'c6', label:'218 BC, the Alps', scene:'alps', text:"Hannibal chose a path no Roman expected.\n\nLeaving his ships, he led his army north, through rivers and the frozen Alps." },
  { id:'c7', label:'218 BC, Rome', scene:'rome', text:"Rome answered the threat.\n\nLegions were raised. Consuls promised a swift victory over an exhausted enemy." },
  { id:'c8', label:'218 BC', scene:'face_off', text:"Both sides were certain the war would be decided quickly.\n\nThey were wrong." },
];
const SCRIPT = [];
const SPEAKERS = {};
for(const c of CHAPTERS){
  SPEAKERS[c.id] = { label: c.label, color: '#fbbf24' };
  c.text.split('\n\n').forEach((part, i) => SCRIPT.push({ scene: c.scene, speaker: c.id, part: i, text: part }));
}
// the oath: Hamilcar speaks for the first part, the boy is shown for the second
SCRIPT.filter(L => L.scene === 'oath').forEach(L => { L.who = L.part === 0 ? 'hamilcar' : 'boy'; L.mood = L.part === 0 ? 'grim' : 'angry'; });

// 1. The western Mediterranean, on the campaign map
const MAP = new Image(); MAP.src = 'IMG_4198.jpeg';
function drawMed(){
  SCENE.rect(0, 0, 128, 160, '#14204a');
  if(MAP.complete && MAP.naturalWidth){
    const off = Math.min(48, SCENE.since() * 0.12);
    SCENE.ctx.drawImage(MAP, 0, -off, 128, 208);
    SCENE.rect(0, 0, 128, 160, 'rgba(10,12,40,0.25)');
    const blink = Math.floor(PX.t/20) % 2;
    for(const [x, y, name, col] of [[56, 98, 'ROME', '#ef4444'], [35, 166, 'CARTHAGE', '#c084fc']]){
      const yy = Math.round(y - off);
      SCENE.rect(x - 2, yy - 2, 5, 5, '#1a1410'); SCENE.rect(x - 1, yy - 1, 3, 3, blink ? col : '#ffffff');
      PX.text(name, x, yy - 9, col);
    }
  }
}

// 2. The sea battle: a Roman galley rams a Carthaginian ship, which burns and sinks
function drawSea(){
  SCENE.sky([[0,'#3a4a64'],[34,'#5a6e8a'],[56,'#8aa0b8']]);
  SCENE.water(62, 98, '#1a3a6a', '#6a8ab0');
  const t = SCENE.since();
  const impact = 150, hit = t > impact;
  const sink = hit ? Math.min(26, (t - impact) * 0.12) : 0;
  const cx = 66, cy = 82 + sink;
  SCENE.ship(cx, cy, { flip:true, sail:'#5a2a7a', stripe:'#f8d048', burning: hit });
  SCENE.rect(cx - 2, 96, 40, 18, '#1a3a6a');                                    // the sea closes over her hull
  for(let i=0; i<5; i++) SCENE.px(cx + ((PX.t*0.5 + i*9) % 36), 96, '#9ab8d8');
  const rx = Math.min(cx - 26, -40 + t * 0.6);
  SCENE.ship(rx, 92, { sail:'#f0ece0', stripe:'#c03028' });
  if(hit && t < impact + 8) SCENE.rect(0, 0, 128, 160, 'rgba(255,255,255,0.35)');
}

// 3. Iberia: Hamilcar rebuilds Carthage's strength in Spain
function drawIberia(){
  SCENE.sky([[0,'#3a2a5a'],[26,'#8a4a5a'],[48,'#e08a4a'],[62,'#f4c070']]);
  SCENE.hills(78, [30,34,40,36,28,22,26,34,42,38,30,24,20,26,32,30,26], '#6a3a2a', '#8a5a3a');
  SCENE.hills(96, [14,18,16,12,10,14,18,20,16,12,10,12,16,18,14,12,10], '#8a5a34', '#aa7a48');
  SCENE.rect(0, 96, 128, 64, '#7a5030');
  for(let i=0; i<5; i++) PX.pic('tent', (6 + i*25)/8 - 0.5, (98 + (i%2)*4)/8 - 1, { r:'#5a2a7a' });
  SCENE.portrait('hamilcar', 'grim');
}

// 4. The oath before the altar
function drawOath(L){
  SCENE.rect(0, 0, 128, 160, '#120c10');
  SCENE.columns(4, 0, 120, 2, 106, '#4a3a34', '#2e2420');
  SCENE.rect(46, 64, 36, 30, '#3a2e28'); SCENE.rect(44, 62, 40, 4, '#5a4a40'); SCENE.rect(44, 92, 40, 4, '#5a4a40');   // the altar
  SCENE.glow(64, 52, 44, '255,140,50', 0.3);
  SCENE.fire(64, 62, 2.6); SCENE.fire(58, 62, 1.6); SCENE.fire(70, 62, 1.6);
  SCENE.portrait(L.who, L.mood);
}

// 5. The army gathers in Spain: veterans, cavalry, and elephants
function drawArmy(){
  SCENE.sky([[0,'#4a7ab8'],[30,'#7aa0cc'],[50,'#c8c8b0']]);
  SCENE.hills(60, [16,22,26,20,14,18,24,28,22,16,12,16,20,24,18,14,12], '#7a6a5a', '#9a8a72');
  PX.ground(16, 20, (x, y) => y*8 >= 56 ? 'sand' : null);
  const t = PX.t;
  for(const x of [8, 40, 72, 104]) PX.figure('elephant', x, 60, { face: 1, frame: Math.floor(t/12) % 2 });
  for(let i=0; i<7; i++) PX.figure('numid', 4 + i*18, 80, { face: 1, frame: Math.floor((t + i*4)/8) % 2 });
  SCENE.formation('libyan', 4, 96, 13, 2, 10, 9, { walk:true });
  SCENE.formation('spaniard', 8, 116, 12, 2, 10, 9, { walk:true });
  SCENE.formation('gaul', 4, 136, 13, 2, 10, 9, { walk:true });
}

// 6. Over the frozen Alps
function drawAlps(){
  SCENE.sky([[0,'#5a6a88'],[40,'#8a9ab0'],[60,'#b8c4d0']]);
  const peaks = [[0,70,40],[30,40,46],[70,56,40],[96,36,50],[124,64,40]];
  for(const [x, y, w] of peaks){
    const g = SCENE.ctx;
    g.fillStyle = '#5a6272'; g.beginPath(); g.moveTo(x - w, 160); g.lineTo(x, y); g.lineTo(x + w, 160); g.closePath(); g.fill();
    g.fillStyle = '#eef2f6'; g.beginPath(); g.moveTo(x - 10, y + 14); g.lineTo(x, y); g.lineTo(x + 10, y + 14); g.lineTo(x + 4, y + 11); g.lineTo(x, y + 15); g.lineTo(x - 5, y + 11); g.closePath(); g.fill();
  }
  PX.ground(16, 20, (x, y) => y*8 >= 104 ? 'snowGround' : null);
  // the column climbs the pass
  const t = PX.t;
  for(let i=0; i<10; i++){
    const p = ((t*0.2 + i*14) % 140);
    const x = 128 - p, y = 150 - p*0.35;
    if(i % 4 === 0) PX.figure('elephant', x, y - 6, { face: -1, frame: Math.floor(t/12) % 2 });
    else PX.figure(i % 2 ? 'libyan' : 'gaul', x, y, { face: -1, frame: Math.floor((t + i*3)/10) % 2, icy: true });
  }
  SCENE.snow(90);
  SCENE.mist(90, 30, 0.3);
}

// 7. Rome raises its legions
function drawRome(){
  SCENE.sky([[0,'#3a6ab0'],[34,'#6a94c8'],[56,'#b8c8d8']]);
  SCENE.rome(92);
  SCENE.rect(52, 70, 24, 22, '#241e30'); SCENE.rect(56, 76, 16, 16, '#0e0a14');   // the city gate
  PX.ground(16, 20, (x, y) => y*8 >= 92 ? (x >= 6 && x <= 9 ? 'road' : 'grass') : null);
  const t = PX.t, p = (t*0.3) % 12;
  for(let r=0; r<6; r++) for(let c=0; c<3; c++) PX.figure('roman', 50 + c*10, 84 + r*12 + p, { frame: Math.floor((t + c*4)/10) % 2 });
  for(const y of [90, 126]) PX.pic('standard', 46/8 - 0.5, y/8 - 1);
}

// 8. Two armies, both certain
function drawFaceOff(L){
  PX.ground(16, 20, () => 'plain');
  const t = PX.t;
  for(const x of [10, 54, 98]) PX.figure('elephant', x, 6, { face: x < 64 ? 1 : -1 });
  SCENE.formation('libyan', 2, 22, 13, 2, 10, 9, {});
  SCENE.formation('roman', 2, 110, 13, 3, 10, 10, { back:true });
  if(L.part === 1){
    SCENE.rect(0, 64, 128, 28, 'rgba(0,0,0,0.6)');
    PX.text('THEY WERE WRONG.', 64, 75, Math.floor(t/30) % 2 ? '#fbbf24' : '#ef4444');
  }
}

SCENE.run({
  script: SCRIPT,
  speakers: SPEAKERS,
  draw: (L) => {
    switch(L.scene){
      case 'med': return drawMed();
      case 'sea': return drawSea();
      case 'iberia': return drawIberia();
      case 'oath': return drawOath(L);
      case 'army': return drawArmy();
      case 'alps': return drawAlps();
      case 'rome': return drawRome();
      default: return drawFaceOff(L);
    }
  }
});
</script>
</body>
</html>
