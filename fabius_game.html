<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<title>Fabius: Pathfinding</title>
<style>
  :root{
    --bg:#1a1a1c;
    --red:#ef4444; --gold:#f59e0b; --blue:#3b82f6; --text:#e7e7ea;
    --grass:#4d7c0f; --forest:#14532d; --hill:#57534e;
  }
  *{box-sizing:border-box; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,sans-serif;
    height:100dvh; width:100%;
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    touch-action:none;
  }

  #game-box{
    position:relative; width:100%; height:100%;
    max-width:800px; background:var(--grass);
    overflow:hidden;
    box-shadow:0 0 20px rgba(0,0,0,0.5);
  }
  canvas{width:100%; height:100%; display:block; image-rendering:pixelated;}

  /* HUD */
  .hud-panel{
    position:absolute; top:10px; width:100%; z-index:15;
    display:flex; justify-content:space-between; padding:0 20px;
    pointer-events:none;
  }
  .stat-box{
    background:rgba(0,0,0,0.7); padding:8px 12px; border-radius:8px;
    border:1px solid rgba(255,255,255,0.15);
    display:flex; flex-direction:column; gap:2px; min-width:110px;
  }
  .stat-label{ font-size:9px; text-transform:uppercase; color:#aaa; font-weight:700; margin-bottom:2px; }
  .stat-val{ font-size:14px; font-weight:900; color:#fff; display:flex; justify-content:space-between; }
  .bar-bg{ width:100%; height:6px; background:#333; margin-bottom:6px; border-radius:3px; overflow:hidden; }
  .bar-fill{ height:100%; transition: width 0.2s; }

  /* CONTROLS */
  .controls-layer{position:absolute; inset:0; z-index:20; pointer-events:none;}

  #stick-zone{
    position:absolute; bottom:30px; left:30px;
    width:140px; height:140px; pointer-events:auto;
    background:rgba(0,0,0,0.1); border-radius:50%;
    touch-action:none;
  }
  .stick-bg{
    width:100%; height:100%; border-radius:50%;
    border:2px solid rgba(255,255,255,0.3); position:relative;
  }
  .stick-nub{
    position:absolute; top:50%; left:50%;
    width:50px; height:50px; margin:-25px 0 0 -25px;
    background:rgba(255,255,255,0.9); border-radius:50%;
    box-shadow:0 2px 5px rgba(0,0,0,0.5);
  }

  .btn-wrapper{
    position:absolute; bottom:40px; right:30px;
    pointer-events:auto;
  }
  #btn-attack{
    width:80px; height:80px;
    background:var(--red);
    border:3px solid #fff; border-radius:50%;
    display:grid; place-items:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    touch-action:none;
  }
  #btn-attack:active{transform:scale(0.95); background:#b91c1c;}
  .sword-icon{font-size:36px; color:#fff;}

  #center-msg{
    position:absolute; top:40%; left:50%; transform:translate(-50%,-50%);
    text-align:center; width:90%; pointer-events:none; z-index:30;
  }
  .big-text{
    font-size:24px; font-weight:900; color:#fff;
    text-shadow:0 2px 8px rgba(0,0,0,0.8);
    opacity:0; transition:opacity 0.5s;
  }

  #overlay{
    position:absolute; inset:0; background:rgba(0,0,0,0.92); z-index:100;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:20px; text-align:center;
  }
  h1{color:var(--gold); margin:0 0 10px 0; font-size:32px; letter-spacing:2px;}
  p{color:#eee; margin-bottom:16px; font-size:15px; max-width:420px; line-height:1.4;}
  .highlight { color:var(--gold); font-weight:bold; }
  .btn-start{
    background:var(--blue); color:#fff; border:none; padding:14px 30px;
    font-size:18px; font-weight:900; border-radius:8px; margin-top:10px;
    box-shadow:0 4px 0 #1e3a8a;
  }
  .btn-start:active{transform:translateY(4px); box-shadow:none;}

  #kbd-hint{
    position:absolute; bottom:10px; left:50%; transform:translateX(-50%);
    z-index:25; font-size:12px; color:#cbd5e1;
    opacity:0; pointer-events:none; text-shadow:0 1px 2px #000;
    transition:opacity .25s;
  }
  @media (pointer:fine){
    #kbd-hint{opacity:0.9;}
  }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
</head>
<body>

<div id="game-box">
  <div id="overlay"></div>

  <div class="hud-panel">
    <div class="stat-box" style="border-color:var(--gold)">
      <div class="stat-label">Your Army</div>
      <div class="stat-val"><span id="ui-hp">50</span></div>
      <div class="bar-bg"><div class="bar-fill" id="bar-hp" style="width:100%; background:var(--red)"></div></div>

      <div class="stat-label">Rome's Patience</div>
      <div class="stat-val"><span id="ui-conf">100</span></div>
      <div class="bar-bg" style="margin-bottom:0"><div class="bar-fill" id="bar-conf" style="width:100%; background:var(--gold)"></div></div>
    </div>

    <div class="stat-box" style="border-color:#7f1d1d; align-items:flex-end;">
      <div class="stat-label">Month</div>
      <div class="stat-val" style="color:#fde68a" id="ui-month">1 / 6</div>

      <div class="stat-label" style="margin-top:6px">Hannibal's Food</div>
      <div class="stat-val" id="ui-food">100</div>
      <div class="bar-bg" style="margin-bottom:0"><div class="bar-fill" id="bar-food" style="width:100%; background:#84cc16"></div></div>
    </div>
  </div>

  <div id="center-msg"><div class="big-text" id="battle-text"></div></div>
  <div id="kbd-hint">ARROWS / WASD MOVE · SPACE STRIKE</div>

  <canvas id="cv"></canvas>

  <div class="controls-layer">
    <div id="stick-zone"><div class="stick-bg"><div class="stick-nub" id="stick"></div></div></div>
    <div class="btn-wrapper">
      <div id="btn-attack"><div class="sword-icon">⚔️</div></div>
    </div>
  </div>
</div>

<script src="campaign.js"></script>
<script src="controls.js"></script>
<script src="pixel.js"></script>
<script>
// ===================================================
//  ROUTING / END FLOW
// ===================================================
const NEXT_PAGE = "map.html";
function goToMap(){ window.location.href = NEXT_PAGE; }

// ===================================================
//  OVERLAY TEMPLATES
// ===================================================
const INTRO_HTML = `
  <h1>THE DELAYER</h1>
  <p><b>Summer 217 BC.</b> After Trasimene, Rome names you dictator: Quintus Fabius Maximus. You have six months.</p>
  <p><b>Do not give Hannibal his battle.</b> On the hills he will not attack you. On open ground he will crush you.</p>
  <p>Shadow him. Pick off his foragers. Burn the crops in his path so he starves (the farmers will hate you for it).</p>
  <p>Every farm he plunders, Rome’s patience runs thinner.</p>
  <button class="btn-start" id="btn-start">BECOME FABIUS</button>
`;

const HISTORY_HTML = `
  <h2 style="color:#f59e0b; margin:0 0 10px 0;">FABIUS MAXIMUS, “THE DELAYER”</h2>
  <div style="text-align:left; font-size:14px; color:#ccc; line-height:1.6; max-width:560px;">
    <p><strong style="color:#fff">THE STRATEGY:</strong><br>
    Fabius knew he could not beat Hannibal in open battle. He shadowed him along the high ground, refused every offer of battle, attacked foraging parties and ordered crops burned in his path.</p>
    <p><strong style="color:#fff">THE COST:</strong><br>
    Romans watched Hannibal plunder the rich Falernian plain while their army stood on the hills. They called Fabius <i>Cunctator</i>, “the Delayer”, and meant it as an insult.</p>
    <p><strong style="color:#fff">MINUCIUS:</strong><br>
    The Senate gave his impatient Master of Horse, Minucius, equal command. Minucius promptly attacked Hannibal near Geronium, was trapped, and was saved only when Fabius marched to his rescue.</p>
    <p><strong style="color:#fff">THE RESULT:</strong><br>
    When his six months ended, Rome went back to elected consuls who promised to fight. One of them was Varro. The next summer, at Cannae, he gave Hannibal exactly the battle Fabius had refused. Only later did Rome return to Fabius’s strategy, and it was the strategy that eventually won the war.</p>
  </div>
`;

function renderIntro(){
  const ov = document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML = INTRO_HTML;
  const histBtn = document.createElement('button');
  histBtn.className = "btn-start";
  histBtn.textContent = "HISTORY";
  histBtn.style.backgroundColor = "#475569";
  histBtn.style.boxShadow = "0 4px 0 #334155";
  histBtn.style.marginTop = "10px";
  histBtn.onclick = ()=> renderHistory('intro');
  ov.appendChild(histBtn);
  document.getElementById('btn-start').onclick = startGame;
}
function renderHistory(backTo){
  const ov = document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML = `
    ${HISTORY_HTML}
    <button class="btn-start" id="btn-back" style="margin-top:18px; background:#475569; box-shadow:0 4px 0 #334155;">BACK</button>
  `;
  document.getElementById('btn-back').onclick = ()=> { if(backTo === 'intro') renderIntro(); };
}

// ===================================================
//  ASSETS
// ===================================================
const P = {
  grass:'#4d7c0f', forest:'#14532d', hill:'#6b6259', hillTop:'#857a6f',
  fabius:'#f59e0b', hannibal:'#7f1d1d', minucius:'#c53030', forager:'#7a4a21',
  village:'#e5e7eb', roof:'#b91c1c', metal:'#94a3b8', shadow:'rgba(0,0,0,0.3)'
};

const CANVAS = document.getElementById('cv');
const BOX = document.getElementById('game-box');

// ===================================================
//  CONFIG
// ===================================================
const TILE = 24;
const GRID_W = 40;
const GRID_H = 60;

const TERR = { PLAIN:0, FOREST:1, HILL:2 };

const STATS = {
  fabHP: 50,
  hanFood: 100,
  hanFoodEvery: 45,      // frames per point of food his army eats
  plunderFood: 30,
  foragerFood: 12,
  fabMove: 10, fabForest: 18, fabHill: 16,
  hanMove: 13, hanForest: 22, hanStarving: 26,
  foragerMove: 16,
  crushDmg: 6, crushCD: 30,
  fabDmg: 3, fabAtkCD: 18,
};
const PLUNDER_FRAMES = 70;

// Rome's patience (Confidence)
const CONF = {
  start: 100,
  drainEvery: 320,       // "Rome grows impatient": -1 every this many frames
  plundered: -8,         // a farm burned by Hannibal
  scorched: -5,          // a farm burned on YOUR orders
  forager: +6,           // a small victory to report
  attackHannibal: +3,    // Rome loves a fight...
  minuciusSaved: +15,
  minuciusLost: -20,
};

const TERM_FRAMES = 6 * 1500;        // six months
const MINUCIUS_MONTH = 3;            // when the Senate splits the command
const STARVE_OUT_FRAMES = 2400;      // Hannibal at zero food this long withdraws

// ===================================================
//  STATE
// ===================================================
let gameActive = false;
let cam = {x:0, y:0};
let grid = [];
let units = [];
let particles = [];
let floats = [];
let fabius = null;
let hannibal = null;
let minucius = null;
let phaseTimer = 0;
let starveT = 0;
let minuciusDone = false;
let raidAlert = { active:false, x:0, y:0, timer:0 };
let stats = { plundered:0, scorched:0, foragers:0 };

let input = {dx:0, dy:0};
let stick = {active:false, startX:0, startY:0, curX:0, curY:0};

// keyboard
const keysDown = new Set();
let lastKeyDir = {dx:0, dy:0};
function computeKeyboardDir(){
  const up = keysDown.has('ArrowUp') || keysDown.has('KeyW');
  const down = keysDown.has('ArrowDown') || keysDown.has('KeyS');
  const left = keysDown.has('ArrowLeft') || keysDown.has('KeyA');
  const right = keysDown.has('ArrowRight') || keysDown.has('KeyD');
  let dx=0, dy=0;
  if(left && !right) dx=-1;
  if(right && !left) dx=1;
  if(up && !down) dy=-1;
  if(down && !up) dy=1;
  if(dx!==0 && dy!==0){
    if(lastKeyDir.dx !== 0) dy=0;
    else dx=0;
  }
  if(dx!==0 || dy!==0) lastKeyDir = {dx,dy};
  return {dx,dy};
}
function setInputFromKeyboard(){
  if(stick.active) return;
  const k = computeKeyboardDir();
  input.dx = k.dx;
  input.dy = k.dy;
}

// ===================================================
//  START / SETUP
// ===================================================
function startGame(){
  document.getElementById('overlay').style.display = 'none';
  if(gameActive) return;
  gameActive = true;
  resize();
  setupMap();
  requestAnimationFrame(loop);
}

function setupMap(){
  units = []; particles = []; floats = [];
  grid = Array(GRID_H).fill(0).map(()=>Array(GRID_W).fill(TERR.PLAIN));
  raidAlert.active = false;
  phaseTimer = 0; starveT = 0; minucius = null; minuciusDone = false;
  stats = { plundered:0, scorched:0, foragers:0 };

  // Campania: rich plains, wooded patches, and ridges of high ground
  for(let y=0; y<GRID_H; y++){
    for(let x=0; x<GRID_W; x++){
      const n = Math.sin(x/4) * Math.cos(y/4);
      if(n > 0.55) grid[y][x] = TERR.HILL;
      else if(n < -0.4) grid[y][x] = TERR.FOREST;
    }
  }

  // Farms and villages on the plain
  let made=0, tries=0;
  while(made < 14 && tries < 500){
    tries++;
    const vx = 2 + Math.floor(Math.random()*(GRID_W-4));
    const vy = 2 + Math.floor(Math.random()*(GRID_H-4));
    if(grid[vy][vx] !== TERR.PLAIN) continue;
    if(units.some(v => Math.abs(v.x-vx) + Math.abs(v.y-vy) < 6)) continue;
    const v = spawnUnit(vx, vy, 'village');
    v.state = 'intact'; v.plunder = 0;
    made++;
  }

  fabius = spawnUnit(20, 50, 'fabius');
  fabius.conf = CONF.start;
  fabius.atkCd = 0;
  hannibal = spawnUnit(20, 10, 'hannibal');
  hannibal.food = STATS.hanFood;
  hannibal.foragerT = 300;
  for(let dy=-1; dy<=1; dy++) for(let dx=-1; dx<=1; dx++){ grid[10+dy][20+dx] = TERR.PLAIN; grid[50+dy][20+dx] = TERR.PLAIN; }

  cam.x = fabius.x*TILE; cam.y = fabius.y*TILE;
  showMsg("SHADOW HIM. DENY HIM BATTLE.", "#fff");
  updateUI();
}

function spawnUnit(gx, gy, type){
  const hp = {hannibal:999, fabius:STATS.fabHP, minucius:25, forager:6, village:20}[type];
  const u = { id:Math.random(), x:gx, y:gy, type, hp, maxHp:hp, cooldown:0 };
  units.push(u);
  return u;
}

// ===================================================
//  LOOP
// ===================================================
function loop(now){
  if(!gameActive) return;
  // a fixed 60 game steps a second, whatever the screen's refresh rate (pixel.js)
  let n = PX.steps(now);
  if(n > 0){
    while(n-- > 0 && gameActive) update();
    if(gameActive) draw();
  }
  requestAnimationFrame(loop);
}

// ===================================================
//  LOGIC
// ===================================================
const month = () => Math.min(6, 1 + Math.floor(phaseTimer / (TERM_FRAMES/6)));

function changeConf(d, why){
  fabius.conf = Math.max(0, Math.min(100, fabius.conf + d));
  if(why) spawnFloat((d>0?'+':'')+d+' '+why, fabius.x, fabius.y-1, d>0 ? '#fde68a' : '#fca5a5');
  updateUI();
}

function onHill(u){ return grid[u.y][u.x] === TERR.HILL; }

function update(){
  phaseTimer++;
  setInputFromKeyboard();
  if(fabius.atkCd > 0) fabius.atkCd--;

  cam.x += (fabius.x*TILE - cam.x)*0.1;
  cam.y += (fabius.y*TILE - cam.y)*0.1;

  if(raidAlert.active && --raidAlert.timer <= 0) raidAlert.active = false;

  // Rome grows impatient
  if(phaseTimer % CONF.drainEvery === 0) changeConf(-1);

  // Fabius moves; terrain sets the pace
  if(fabius.cooldown > 0) fabius.cooldown--;
  if(fabius.cooldown <= 0 && (input.dx || input.dy)){
    if(tryMove(fabius, input.dx, input.dy, true)){
      const t = grid[fabius.y][fabius.x];
      fabius.cooldown = t===TERR.HILL ? STATS.fabHill : t===TERR.FOREST ? STATS.fabForest : STATS.fabMove;
    }
  }

  // The Senate splits the command
  if(!minucius && !minuciusDone && month() >= MINUCIUS_MONTH) splitCommand();

  handleHannibal();
  for(const u of units){
    if(u.type==='forager') handleForager(u);
    if(u.type==='minucius') handleMinucius(u);
  }
  units = units.filter(u => u.hp > 0 || u.type==='village');

  updateFX();
  updateUI();

  // ENDINGS
  if(fabius.hp <= 0){ finishRun('dead'); return; }
  if(fabius.conf <= 0){ finishRun('recalled'); return; }
  if(hannibal.food <= 0){ if(++starveT > STARVE_OUT_FRAMES){ finishRun('starved'); return; } }
  else starveT = 0;
  if(phaseTimer >= TERM_FRAMES){ finishRun('term'); return; }
}

// ---------- HANNIBAL ----------
function nearestVillage(from, maxD=999){
  let best=null, bd=maxD;
  for(const v of units){
    if(v.type!=='village' || v.state!=='intact') continue;
    const d = dist(from, v);
    if(d < bd){ bd=d; best=v; }
  }
  return best;
}

function handleHannibal(){
  // His army eats
  if(phaseTimer % STATS.hanFoodEvery === 0 && hannibal.food > 0) hannibal.food--;

  // Send out foraging parties
  if(--hannibal.foragerT <= 0){
    // A hungry army forages further and more often
    const hungry = hannibal.food < 25;
    hannibal.foragerT = (hungry ? 200 : 420) + Math.random()*240;
    const v = nearestVillage(hannibal, hungry ? 999 : 26);
    if(v && units.filter(u=>u.type==='forager').length < (hungry ? 6 : 4)){
      const f = spawnUnit(hannibal.x, hannibal.y, 'forager');
      f.target = v; f.carrying = 0; f.cooldown = 10;
    }
  }

  if(hannibal.cooldown > 0){ hannibal.cooldown--; return; }

  // Easy prey first: Minucius, then you if you're caught on open ground nearby.
  let target = null, mode = 'raid';
  if(minucius && minucius.hp > 0 && dist(hannibal, minucius) < 14){ target = minucius; mode = 'fight'; }
  else if(dist(hannibal, fabius) <= 7){
    if(!onHill(fabius)){ target = fabius; mode = 'fight'; }
    else { mode = 'bait'; }   // he won't climb after you; he waits below, daring you to come down
  }
  if(!target && mode !== 'bait') target = nearestVillage(hannibal);

  if(mode === 'bait'){
    if(phaseTimer % 120 === 0) spawnFloat("Come down and fight!", hannibal.x, hannibal.y-1, '#fca5a5');
    hannibal.cooldown = 20;
    return;
  }

  if(target){
    if(dist(hannibal, target) <= 1.5){
      if(target.type === 'village'){
        target.plunder++;
        hannibal.cooldown = 1;
        if(target.plunder === 1){
          raidAlert = { active:true, x:target.x, y:target.y, timer:PLUNDER_FRAMES+30 };
          spawnFloat("HELP!", target.x, target.y, '#ef4444');
        }
        if(target.plunder >= PLUNDER_FRAMES) plunderVillage(target, STATS.plunderFood);
        return;
      }
      // Battle on open ground: he crushes you
      if(target === fabius && onHill(fabius)){ hannibal.cooldown = 20; return; }
      target.hp -= STATS.crushDmg;
      target._hitT = PX.t; hannibal._atkT = PX.t;
      if(target === fabius) PX.shake(5);
      spawnBlood(target.x, target.y);
      spawnFloat("CRUSHED!", target.x, target.y, '#f00');
      if(target === minucius && target.hp <= 0) minuciusLost();
      hannibal.cooldown = STATS.crushCD;
      return;
    }
    const step = getSmartStep(hannibal, target);
    if(step.x || step.y){
      tryMove(hannibal, step.x, step.y, false);
      const t = grid[hannibal.y][hannibal.x];
      const base = hannibal.food <= 0 ? STATS.hanStarving : STATS.hanMove;
      hannibal.cooldown = t===TERR.FOREST ? base + 9 : base;
      return;
    }
  }
  hannibal.cooldown = 20;
}

function plunderVillage(v, food){
  v.state = 'plundered';
  hannibal.food = Math.min(100, hannibal.food + food);
  stats.plundered++;
  showMsg("FARMS BURN IN CAMPANIA!", "#ef4444");
  changeConf(CONF.plundered, "Rome is angry");
  raidAlert.active = false;
}

// ---------- FORAGERS ----------
function handleForager(f){
  if(f.hp <= 0) return;
  if(f.cooldown > 0){ f.cooldown--; return; }
  f.cooldown = STATS.foragerMove;
  if(!f.carrying){
    if(!f.target || f.target.state !== 'intact') f.target = nearestVillage(f, hannibal.food < 25 ? 999 : 26);
    if(!f.target){ f.carrying = -1; return; }     // nothing left: head home empty-handed
    if(dist(f, f.target) <= 1.5){
      f.target.plunder += 12;
      if(f.target.plunder >= PLUNDER_FRAMES){ plunderVillage(f.target, 0); f.carrying = STATS.foragerFood; }
      return;
    }
    const st = getSmartStep(f, f.target); tryMove(f, st.x, st.y, false);
  } else {
    if(dist(f, hannibal) <= 1.5){
      if(f.carrying > 0){ hannibal.food = Math.min(100, hannibal.food + f.carrying); spawnFloat("+FOOD", hannibal.x, hannibal.y, '#84cc16'); }
      f.hp = 0;   // rejoins the army
      return;
    }
    const st = getSmartStep(f, hannibal); tryMove(f, st.x, st.y, false);
  }
}

// ---------- MINUCIUS ----------
function splitCommand(){
  // He takes half your army and marches off to fight.
  const share = Math.floor(fabius.hp / 2);
  fabius.hp -= share;
  minucius = spawnUnit(fabius.x + (fabius.x < 30 ? 2 : -2), fabius.y, 'minucius');
  if(grid[minucius.y][minucius.x] === TERR.HILL) grid[minucius.y][minucius.x] = TERR.PLAIN;
  minucius.hp = minucius.maxHp = Math.max(10, share);
  minucius.cooldown = 60;
  showMsg("THE SENATE GIVES MINUCIUS EQUAL COMMAND!", "#fde68a");
  setTimeout(()=>{ if(gameActive && minucius) showMsg("MINUCIUS MARCHES TO ATTACK HANNIBAL!", "#fca5a5"); }, 2600);
}

function handleMinucius(m){
  if(m.hp <= 0) return;
  // Rescue: reach him while Hannibal has him pinned
  if(dist(m, fabius) <= 2.5){
    fabius.hp = Math.min(STATS.fabHP, fabius.hp + m.hp);
    m.hp = 0; minucius = null; minuciusDone = true;
    showMsg("FABIUS RESCUES MINUCIUS!", "#fde68a");
    changeConf(CONF.minuciusSaved, "Rome remembers");
    // Hannibal draws off rather than face both armies at once
    hannibal.cooldown = 120;
    return;
  }
  if(m.cooldown > 0){ m.cooldown--; return; }
  m.cooldown = 22;
  if(dist(m, hannibal) > 1.5){
    const st = getSmartStep(m, hannibal); tryMove(m, st.x, st.y, false);
  }
}
function minuciusLost(){
  minucius.hp = 0; minucius = null; minuciusDone = true;
  showMsg("MINUCIUS' ARMY IS DESTROYED!", "#ef4444");
  changeConf(CONF.minuciusLost, "disaster");
}

// ---------- PATHFINDING (BFS around high ground) ----------
function getSmartStep(unit, target){
  if(dist(unit, target) <= 1.5) return {x:0, y:0};
  const queue = [{x: unit.x, y: unit.y}];
  const cameFrom = new Map();
  const key = (x,y)=> x+","+y;
  cameFrom.set(key(unit.x,unit.y), null);
  let found = null, closest = {x:unit.x, y:unit.y, d:1e9};
  let limit = 600;
  const dirs = [[0,1],[0,-1],[1,0],[-1,0]];
  while(queue.length && limit-- > 0){
    const c = queue.shift();
    if(Math.abs(c.x-target.x) + Math.abs(c.y-target.y) <= 1){ found = c; break; }
    const d = Math.abs(c.x-target.x) + Math.abs(c.y-target.y);
    if(d < closest.d) closest = {x:c.x, y:c.y, d};
    for(const [dx,dy] of dirs){
      const nx=c.x+dx, ny=c.y+dy;
      if(nx<0||nx>=GRID_W||ny<0||ny>=GRID_H) continue;
      if(grid[ny][nx] === TERR.HILL) continue;   // the Carthaginian army keeps to the plain
      const k = key(nx,ny);
      if(cameFrom.has(k)) continue;
      cameFrom.set(k, c);
      queue.push({x:nx, y:ny});
    }
  }
  let cur = found || closest;
  let prev = null;
  while(cur && !(cur.x===unit.x && cur.y===unit.y)){ prev = cur; cur = cameFrom.get(key(cur.x,cur.y)); }
  return prev ? {x: prev.x-unit.x, y: prev.y-unit.y} : {x:0, y:0};
}

function tryMove(u, dx, dy, canClimb){
  const tx = u.x + dx, ty = u.y + dy;
  if(tx<0||tx>=GRID_W||ty<0||ty>=GRID_H) return false;
  if(grid[ty][tx] === TERR.HILL && !canClimb) return false;
  u.x = tx; u.y = ty;
  return true;
}

// ===================================================
//  ACTIONS: strike / scorch
// ===================================================
function doAttack(e){
  if(e){ e.stopPropagation?.(); e.preventDefault?.(); }
  if(!gameActive) return;
  if(fabius.atkCd > 0) return;
  fabius.atkCd = STATS.fabAtkCD;

  // 1. Foragers in reach: cut them down
  const f = units.find(u => u.type==='forager' && u.hp>0 && dist(u, fabius) <= 1.5);
  if(f){
    f.hp -= STATS.fabDmg;
    f._hitT = PX.t;
    spawnBlood(f.x, f.y);
    if(f.hp <= 0){ stats.foragers++; changeConf(CONF.forager, "foragers routed"); }
    return;
  }
  // 2. Hannibal himself: Rome cheers... and he answers
  if(dist(fabius, hannibal) <= 1.5){
    spawnFloat("He barely notices", hannibal.x, hannibal.y, '#aaa');
    changeConf(CONF.attackHannibal, "Rome cheers");
    if(!onHill(fabius)){ fabius.hp -= STATS.crushDmg; fabius._hitT = PX.t; PX.shake(5); spawnBlood(fabius.x, fabius.y); }
    return;
  }
  // 3. Scorched earth: burn the crops before he can take them
  const v = units.find(u => u.type==='village' && u.state==='intact' && dist(u, fabius) <= 2);
  if(v){
    v.state = 'scorched';
    stats.scorched++;
    for(let i=0;i<12;i++){
      particles.push({ x:v.x*TILE+TILE/2, y:v.y*TILE+TILE/2, vx:(Math.random()-.5)*4, vy:(Math.random()-.8)*4, life:1, color: Math.random()>0.5 ? '#f59e0b' : '#ef4444' });
    }
    showMsg("SCORCHED EARTH!", "#f59e0b");
    changeConf(CONF.scorched, "farmers curse you");
    return;
  }
  spawnFloat("...", fabius.x, fabius.y, "#aaa");
}

function updateUI(){
  document.getElementById('ui-conf').innerText = Math.floor(fabius.conf);
  document.getElementById('bar-conf').style.width = fabius.conf + "%";
  document.getElementById('ui-hp').innerText = Math.max(0, Math.floor(fabius.hp));
  document.getElementById('bar-hp').style.width = Math.max(0, fabius.hp / STATS.fabHP) * 100 + "%";
  document.getElementById('ui-month').innerText = month() + " / 6";
  document.getElementById('ui-food').innerText = Math.floor(hannibal.food);
  document.getElementById('bar-food').style.width = hannibal.food + "%";
}

// ===================================================
//  END SCREEN -> HISTORY -> MAP
// ===================================================
const ENDINGS = {
  term: { title:'SIX MONTHS', col:'#fbbf24', line:'Your dictatorship is over. The army is intact.',
    text:'You did not lose. That was the problem. Rome wanted a victory, and the voters elected consuls who promised one. One of them was Gaius Terentius Varro.' },
  recalled: { title:'RECALLED', col:'#ef4444', line:'Rome has run out of patience.',
    text:'“Cunctator,” they call you: the Delayer. The Senate strips you of real power and hands the war to men who promise to fight. Next summer they will march eight legions to a place called Cannae.' },
  dead: { title:'DEFEAT', col:'#ef4444', line:'You gave Hannibal the battle he wanted.',
    text:'On open ground, against Hannibal, a Roman army could not win. Fabius understood this. You forgot it for one afternoon.' },
  starved: { title:'HANNIBAL WITHDRAWS', col:'#fbbf24', line:'Starving, his army pulls out of Campania.',
    text:'Your strategy worked. Rome barely noticed: there was no great battle to celebrate. Your term ends, and the next consuls go looking for one at Cannae.' },
};

function finishRun(kind){
  gameActive=false;
  spwMarkDone('fabian');
  document.getElementById('battle-text').style.opacity = 0;
  const E = ENDINGS[kind];
  const ov = document.getElementById('overlay');
  ov.style.display='flex';
  ov.innerHTML = `
    <h1 style="color:${E.col}">${E.title}</h1>
    <p><b>${E.line}</b></p>
    <p>${E.text}</p>
    <p style="font-size:13px; color:#aaa;">Farms plundered: ${stats.plundered} · Burned on your orders: ${stats.scorched} · Foragers routed: ${stats.foragers}</p>
    <button class="btn-start" id="btn-map" style="margin-top:12px;">CONTINUE CAMPAIGN</button>
    <button class="btn-start" id="btn-replay" style="margin-top:10px; background:#475569; box-shadow:0 4px 0 #334155;">REPLAY</button>
    <button class="btn-start" id="btn-hist" style="margin-top:10px; background:#475569; box-shadow:0 4px 0 #334155;">HISTORY</button>
  `;
  document.getElementById('btn-map').onclick = goToMap;
  document.getElementById('btn-replay').onclick = ()=> location.reload();
  document.getElementById('btn-hist').onclick = ()=> {
    ov.innerHTML = `${HISTORY_HTML}
      <button class="btn-start" id="btn-map2" style="margin-top:18px;">CONTINUE CAMPAIGN</button>`;
    document.getElementById('btn-map2').onclick = goToMap;
  };
}

// ===================================================
//  VISUALS
// ===================================================
const FAB_TILE = { [TERR.PLAIN]:'grass', [TERR.FOREST]:'forest', [TERR.HILL]:'hill' };

// An army on the map: its commander with a few men around him (and, for Hannibal, his last elephant)
const ARMIES = {
  fabius:   { lead:'yours',    men:['roman','roman','roman','roman'] },
  minucius: { lead:'roman',    men:['roman','roman','triarii'] },
  hannibal: { lead:'hannibal', men:['libyan','gaul','spaniard','libyan'], elephant:true },
};
const ESCORT = [[-6,-4],[6,-4],[-6,3],[6,3]];
function drawArmy(u){
  const A = ARMIES[u.type];
  const moving = PX.glide(u);
  const T8 = PX.T, bx = Math.round(u._rx*T8), by = Math.round(u._ry*T8);
  const frame = moving ? Math.floor(PX.t/8) % 2 : 0;
  const flash = u._hitT !== undefined && PX.t - u._hitT < 5;
  const face = u._face || 1;
  if(A.elephant) PX.figure('elephant', bx + 9*face, by - 5, { face, frame, flash });
  const men = A.men.map((k,i) => ({ k, dx:ESCORT[i][0], dy:ESCORT[i][1] }));
  for(const m of men.filter(m => m.dy < 0)) PX.figure(m.k, bx+m.dx, by+m.dy, { face, frame, flash });
  PX.figure(A.lead, bx, by, { face, frame, flash });
  for(const m of men.filter(m => m.dy > 0)) PX.figure(m.k, bx+m.dx, by+m.dy, { face, frame, flash });
}

function drawVillage(v){
  if(v.state === 'intact'){
    PX.pic('house', v.x, v.y);
    if(v.plunder > 0){
      // being plundered: a burning bar over the roof
      PX.rectWorld(v.x - 0.5, v.y - 1.25, 2, 0.25, '#1a1410');
      PX.rectWorld(v.x - 0.5, v.y - 1.25, Math.round(16*Math.min(1, v.plunder/PLUNDER_FRAMES))/8, 0.25, '#ef4444');
    }
    return;
  }
  PX.pic('ruin', v.x, v.y);
  // still smouldering
  const t = PX.t;
  if(t % 40 < 30){
    PX.dot(v.x + 0.3, v.y - 0.1, '#f59e0b', 1); PX.dot(v.x + 0.5, v.y - 0.3, '#ef4444', 1); PX.dot(v.x + 0.7, v.y - 0.1, '#fde047', 1);
  }
  const rise = (t % 60) / 60;
  PX.dot(v.x + 0.4 + Math.sin(t/20)*0.2, v.y - 0.5 - rise, 'rgba(160,160,160,0.8)', 1);
}

function draw(){
  PX.begin(cam.x/TILE + 0.5, cam.y/TILE + 0.5, '#2a3a1a', { w: GRID_W, h: GRID_H });
  PX.ground(GRID_W, GRID_H, (x,y) => FAB_TILE[grid[y][x]]);

  const all = units.filter(u => u.hp > 0 || u.type==='village');
  all.sort((a,b)=>a.y - b.y);
  for(const u of all){
    if(u.type==='village') drawVillage(u);
    else if(u.type==='forager') PX.unit(u, 'forager', {});
    else drawArmy(u);
  }

  // On the hills you are safe: say so
  if(onHill(fabius)) PX.label("HIGH GROUND", fabius._rx ?? fabius.x, (fabius._ry ?? fabius.y) - 1.6, '#fde68a');

  for(const p of particles) PX.dot(p.x/TILE, p.y/TILE, p.color);
  for(const f of floats){ if(f.life > 0.15) PX.label(f.text, f.x/TILE, f.y/TILE, f.color); }

  // Off-screen pointers: a farm being plundered, and Minucius
  if(raidAlert.active) PX.pointer(raidAlert.x, raidAlert.y, '#ef4444', 'HELP!');
  if(minucius && minucius.hp > 0) PX.pointer(minucius.x, minucius.y, '#fbbf24', 'MINUCIUS');
}

// ===================================================
//  UTILS / FX
// ===================================================
function dist(a,b){ return Math.sqrt((a.x-b.x)*(a.x-b.x) + (a.y-b.y)*(a.y-b.y)); }
function spawnBlood(gx, gy){
  for(let i=0;i<3;i++) particles.push({x:gx*TILE+TILE/2, y:gy*TILE+TILE/2, vx:(Math.random()-.5)*3, vy:(Math.random()-.5)*3, life:1, color:'#900'});
}
function spawnFloat(txt,gx,gy,col){ floats.push({x:gx*TILE, y:gy*TILE, text:txt, life:1, color:col}); }
function updateFX(){
  particles.forEach(p=>{p.x+=p.vx; p.y+=p.vy; p.life-=0.05}); particles=particles.filter(p=>p.life>0);
  floats.forEach(f=>{f.y-=0.3; f.life-=0.02}); floats=floats.filter(f=>f.life>0);
}
function showMsg(txt, col){
  const el=document.getElementById('battle-text');
  el.innerText=txt; el.style.color=col; el.style.opacity=1;
  setTimeout(()=>el.style.opacity=0, 2500);
}

// ===================================================
//  INPUT (Pointer joystick + keyboard)
// ===================================================
const stickZone=document.getElementById('stick-zone');
const stickEl=document.getElementById('stick');

function endStick(){
  stick.active=false;
  stickEl.style.transform='translate(0,0)';
  input.dx=0; input.dy=0;
}
function updateStick(){
  let dx=stick.curX-stick.startX, dy=stick.curY-stick.startY;
  let d=Math.sqrt(dx*dx+dy*dy);
  const max=40;
  if(d>max){ dx=(dx/d)*max; dy=(dy/d)*max; }
  stickEl.style.transform=`translate(${dx}px, ${dy}px)`;
  input.dx=0; input.dy=0;
  if(d>10){
    if(Math.abs(dx)>Math.abs(dy)) input.dx=Math.sign(dx);
    else input.dy=Math.sign(dy);
  }
}

stickZone.addEventListener('pointerdown', (e)=>{
  if(stick.active) return;
  stick.pid = e.pointerId;
  stick.active=true;
  stick.startX=e.clientX; stick.startY=e.clientY;
  stick.curX=e.clientX; stick.curY=e.clientY;
  stickZone.setPointerCapture(e.pointerId);
  updateStick();
}, {passive:false});
stickZone.addEventListener('pointermove', (e)=>{
  if(!stick.active || e.pointerId !== stick.pid) return;
  e.preventDefault();
  stick.curX=e.clientX; stick.curY=e.clientY;
  updateStick();
}, {passive:false});
const endOwnStick = e => { if(e.pointerId === stick.pid) endStick(); };
stickZone.addEventListener('pointerup', endOwnStick, {passive:true});
stickZone.addEventListener('pointercancel', endOwnStick, {passive:true});
stickZone.addEventListener('lostpointercapture', endOwnStick, {passive:true});

document.getElementById('btn-attack').addEventListener('pointerdown', doAttack, {passive:false});

// Desktop keys
window.addEventListener('keydown', (e)=>{
  const relevant = ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','Space','Enter'];
  if(relevant.includes(e.code)) e.preventDefault();

  if(e.code === 'Space'){ doAttack(e); return; }
  keysDown.add(e.code);
  setInputFromKeyboard();
}, {passive:false});
window.addEventListener('keyup', (e)=>{
  keysDown.delete(e.code);
  setInputFromKeyboard();
}, {passive:true});

// Prevent scrolling while playing
document.addEventListener('touchmove', (e)=>{ if(gameActive) e.preventDefault(); }, {passive:false});

// ===================================================
//  RESIZE (RETINA)
// ===================================================
let pxReady = false;
function resize(){
  if(!pxReady){ PX.init(CANVAS, { scale: 3 }); pxReady = true; }
  else PX.resize();
}
window.addEventListener('resize', resize, {passive:true});
window.addEventListener('orientationchange', resize, {passive:true});

// BOOT
resize();
renderIntro();
</script>
