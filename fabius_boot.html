<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Fabius: The Appointment</title>
<style>
    body {
        margin: 0; padding: 0; background: #000;
        height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Courier New', Courier, monospace; overflow: hidden;
    }
    #stage {
        position: relative; width: 100%; max-width: 600px; 
        /* CHANGED: Taller aspect ratio for portrait feel + room for text */
        aspect-ratio: 3/4; 
        background: #111; overflow: hidden;
        border: 2px solid #333;
        box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    
    /* DIALOGUE BOX */
    #dialogue-box {
        position: absolute; bottom: 0; left: 0;
        width: 100%; background: #1f1f1f; 
        border-top: 4px solid #f59e0b; 
        padding: 15px 20px; display: none; z-index: 30;
        cursor: pointer; height: 130px; 
        box-sizing: border-box;
    }
    .speaker-name {
        color: #f59e0b; font-weight: 900; font-size: 16px; text-transform: uppercase;
        margin-bottom: 8px; letter-spacing: 2px;
    }
    .speech-text {
        color: #e7e7ea; font-size: 17px; line-height: 1.3; white-space: pre-wrap;
    }
    
    .click-prompt {
        position: absolute; bottom: 10px; right: 20px;
        font-size: 12px; color: #777; animation: blink 1s infinite;
    }

    /* TITLE SCREEN */
    #title-screen {
        position: absolute; inset: 0; 
        background: #4d7c0f; 
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 50; text-align: center;
        opacity: 0; transition: opacity 2s;
    }
    h1 { 
        font-size: 64px; color: #fff; margin: 0; 
        text-transform: uppercase; letter-spacing: 4px; 
        text-shadow: 0 4px 0 #14532d;
    }
    h2 { font-size: 18px; color: #ccfbf1; margin-bottom: 30px; letter-spacing: 2px; font-weight:800; }
    
    button {
        background: #1e3a8a; color: #fff; border: 4px solid #fff;
        padding: 15px 40px; font-size: 20px; font-weight: 900; cursor: pointer;
        text-transform: uppercase; 
        box-shadow: 0 6px 0 #0f172a;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #0f172a; }

    @keyframes blink { 50% { opacity: 0; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boot.css">
</head>
<body>

<div id="stage">
    <canvas id="cv"></canvas>
    
    <div id="dialogue-box" onclick="nextLine()">
        <div class="speaker-name" id="speaker">The Senate</div>
        <div class="speech-text" id="speech"></div>
        <div class="click-prompt">TAP TO CONTINUE ▼</div>
    </div>

    <div id="title-screen">
        <h1>THE DELAYER</h1>
        <h2>Summer, 217 BC</h2>
        <button onclick="window.location.href='fabius_game.html'">Begin Campaign</button>
        <button onclick="window.location.href='map.html'" style="margin-top:15px; background:#475569; box-shadow:0 4px 0 #334155;">Back to Map</button>
    </div>
</div>

<script src="controls.js"></script>
<script src="pixel.js"></script>
<script src="scene.js"></script>
<script>
const SCRIPT = [
    { scene: 'senate',  speaker: 'senator', mood: 'worry', text: "Flaminius is dead, his army destroyed at Lake Trasimene. The Republic bleeds." },
    { scene: 'senate',  speaker: 'senator', mood: 'angry', text: "The people are in panic, Fabius. They demand action. They demand a Dictator." },
    { scene: 'rome',    speaker: 'fabius',  mood: 'grim',  text: "I will accept the burden. But hear me: I will not give you the battle you seek." },
    { scene: 'rome',    speaker: 'fabius',  mood: 'grim',  text: "Hannibal cannot be beaten on the field. I will burn the crops. I will starve him. I will wait." },
    { scene: 'senate',  speaker: 'senator', mood: 'angry', text: "Cowardice? You would have Rome hide behind walls while Italy burns?" },
    { scene: 'rome',    speaker: 'fabius',  mood: 'tired', text: "I would have Rome survive." },
    { scene: 'senate',  speaker: 'senator', mood: 'worry', text: "Very well. Take the legions..." },
    { scene: 'campania',speaker: 'senator', mood: 'neutral', text: "Six months, Fabius. Rome's patience will not last forever." }
];

// The Curia: marble columns, benches of senators, light from high windows
function drawSenate(mood){
    SCENE.rect(0, 0, 128, 160, '#5a4e40');
    SCENE.rect(0, 0, 128, 70, '#8a7e6a');
    SCENE.columns(4, 4, 66, 5, 28);
    const g = SCENE.ctx;
    for(const x of [18, 46, 74, 102]){                       // sun through the high windows
        SCENE.rect(x, 6, 6, 10, '#f4e8c0');
        g.fillStyle = 'rgba(255,240,200,0.12)';
        g.beginPath(); g.moveTo(x, 16); g.lineTo(x + 6, 16); g.lineTo(x + 26, 150); g.lineTo(x + 10, 150); g.closePath(); g.fill();
    }
    for(let tier=0; tier<3; tier++){                           // benches of senators
        const y = 68 + tier*14;
        SCENE.rect(0, y + 8, 128, 4, '#6a4a2a'); SCENE.rect(0, y + 8, 128, 1, '#8a6a42');
        for(let i=0; i<16; i++){
            const x = 4 + i*8 + (tier%2)*4;
            const nod = ((PX.t + i*31 + tier*17) % 160) < 6 ? 1 : 0;
            SCENE.tiny(x, y + nod, '#ece6d4', '#e0a878', i%3 ? null : '#7a2a8a');
        }
    }
    SCENE.dither(0, 112, 128, 48, '#6a5e4c', '#625644');      // mosaic floor
    SCENE.portrait('senator', mood);
}

// Fabius before Rome at dusk; smoke from burning farms on the horizon
function drawRome(mood){
    SCENE.sky([[0,'#2a2040'],[24,'#4a2e52'],[44,'#8a4a5a'],[60,'#d07a50'],[72,'#f0b060']]);
    for(const x of [10, 112]) SCENE.smoke(x, 82, 50);
    SCENE.rome(108);
    SCENE.rect(0, 108, 128, 52, '#1e1a26');
    SCENE.portrait('fabius', mood);
}

// Campania as you will see it: Fabius on the high ground, Hannibal plundering the plain
function drawCampania(){
    PX.ground(16, 20, (x, y) => {
        if(y < 6 && x < 7 && (x + y) < 9) return 'hill';
        if((x > 10 && y < 5) || (x < 3 && y > 13)) return 'forest';
        return 'grass';
    });
    const farms = [[9, 7, 'ruin'], [13, 10, 'house'], [5, 13, 'ruin'], [11, 15, 'house'], [2, 9, 'house']];
    for(const [x, y, k] of farms){
        PX.pic(k, x, y);
        if(k === 'ruin'){ SCENE.fire(x*8 + 4, y*8 + 4, 1.2); SCENE.smoke(x*8 + 4, y*8, 46); }
    }
    // Fabius' army on the ridge
    const t = PX.t;
    for(const [dx, dy, k] of [[-6,-3,'roman'],[6,-3,'roman'],[0,0,'yours'],[-6,4,'roman'],[6,4,'roman']]) PX.figure(k, 22 + dx, 22 + dy, {});
    PX.pic('standard', 1.6, 1.2);
    // Hannibal's army on the plain, with his elephant
    const hx = 84 + Math.round(Math.sin(t/120) * 6), hy = 92;
    PX.figure('elephant', hx + 10, hy - 4, { face: -1 });
    for(const [dx, dy, k] of [[-6,-3,'libyan'],[6,-3,'gaul'],[0,0,'hannibal'],[-6,4,'spaniard'],[6,4,'libyan']]) PX.figure(k, hx + dx, hy + dy, { face: -1 });
    PX.label('HIGH GROUND', 3, 4.3, '#fde68a');
}

SCENE.run({
    script: SCRIPT,
    speakers: {
        senator: { label: 'Senator', color: '#c084fc' },
        fabius:  { label: 'Fabius',  color: '#f59e0b' },
    },
    draw: (L) => {
        if(L.scene === 'senate') drawSenate(L.mood);
        else if(L.scene === 'rome') drawRome(L.mood);
        else drawCampania();
    }
});
</script>
</body>
</html>
