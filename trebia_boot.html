<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Trebia: The Cold Crossing</title>
<style>
    body {
        margin: 0; padding: 0; background: #000;
        height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Courier New', Courier, monospace; overflow: hidden;
    }
    #stage {
        position: relative; width: 100%; max-width: 800px; aspect-ratio: 4/3;
        background: #111; overflow: hidden;
        border: 2px solid #333;
        box-shadow: 0 0 20px rgba(0,0,0,0.8);
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    
    /* DIALOGUE BOX */
    #dialogue-box {
        position: absolute; bottom: 0; left: 0;
        width: 100%; background: rgba(0,0,0,0.9); border-top: 4px solid #fff;
        padding: 20px; display: none; z-index: 20;
        cursor: pointer; height: 120px; 
        box-sizing: border-box;
    }
    .speaker-name {
        color: #ef4444; font-weight: 900; font-size: 16px; text-transform: uppercase;
        margin-bottom: 8px; letter-spacing: 1px;
    }
    .speech-text {
        color: #fff; font-size: 18px; line-height: 1.4; white-space: pre-wrap;
    }
    
    /* CLICK PROMPT */
    .click-prompt {
        position: absolute; bottom: 10px; right: 20px;
        font-size: 12px; color: #fbbf24; animation: blink 1s infinite;
    }

    /* TITLE SCREEN */
    #title-screen {
        position: absolute; inset: 0; background: rgba(0,0,0,0.85);
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 50; text-align: center;
    }
    h1 { font-size: 64px; color: #ef4444; margin: 0; text-transform: uppercase; letter-spacing: 5px; text-shadow: 4px 4px 0 #000; }
    h2 { font-size: 18px; color: #fbbf24; margin-bottom: 30px; letter-spacing: 2px; }
    button {
        background: #ef4444; color: #fff; border: 4px solid #fff;
        padding: 15px 40px; font-size: 20px; font-weight: bold; cursor: pointer;
        text-transform: uppercase; box-shadow: 0 6px 0 #7f1d1d;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #7f1d1d; }

    @keyframes blink { 50% { opacity: 0; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boot.css">
</head>
<body>

<div id="stage">
    <canvas id="cv"></canvas>
    
    <div id="dialogue-box" onclick="nextLine()">
        <div class="speaker-name">Sempronius Longus</div>
        <div class="speech-text" id="speech"></div>
        <div class="click-prompt">TAP TO CONTINUE ▼</div>
    </div>

    <div id="title-screen">
        <h1>TREBIA</h1>
        <h2>Winter, 218 BC</h2>
        <button onclick="window.location.href='trebia_game.html'">Start Battle</button>
        <button onclick="window.location.href='map.html'" style="margin-top:15px; background:#475569; box-shadow:0 4px 0 #334155;">Back to Map</button>
    </div>
</div>

<script src="controls.js"></script>
<script src="pixel.js"></script>
<script src="scene.js"></script>
<script>
const SCRIPT = [
    { scene: 'tent',  mood: 'neutral', text: "Scipio lies wounded in his tent. He begs me to wait." },
    { scene: 'tent',  mood: 'angry',   text: "\"Wait for reinforcements!\" he says. \"Wait for spring!\"" },
    { scene: 'tent',  mood: 'angry',   text: "But my consulship ends in a month! I will not leave this glory for the next man." },
    { scene: 'tent',  mood: 'smug',    text: "Hannibal is right there. Just across that river." },
    { scene: 'alarm', mood: 'angry',   text: "What is that noise? Numidian horsemen, raiding our camp at dawn!" },
    { scene: 'alarm', mood: 'yell',    text: "They mock us! Every man out after them. Now!" },
    { scene: 'river', mood: 'action',  text: "The river is freezing, they say. The men have not even eaten, they say..." },
    { scene: 'alarm', mood: 'yell',    text: "But we are ROMANS! We never wait for glory!" },
    { scene: 'river', mood: 'action',  text: "Legions! Forward! Across the Trebia, after them!" }
];

// Sempronius in his command tent, by lantern light
function drawTent(mood){
    SCENE.tent();
    SCENE.portrait('sempronius', mood);
}

// Dawn: Numidian horsemen raiding the snowy camp
function drawAlarm(mood){
    SCENE.camp([[0,'#141a34'],[26,'#2c2a52'],[46,'#6a3a62'],[62,'#c0645a'],[74,'#f0a060']],
               { groundTile:'snowGround', hill:'#283034', hillTop:'#c8ccd0', ground:'#c2c6c4' });
    SCENE.smoke(22, 78, 56); SCENE.fire(22, 80, 1.4);
    SCENE.smoke(104, 84, 40); SCENE.fire(104, 86, 1);
    const t = PX.t;
    for(let i=0; i<5; i++){
        const x = ((t*0.9 + i*36) % 180) - 26;
        PX.figure('numid', x, 88 + (i%2)*5, { face:1, frame: Math.floor((t + i*3)/5) % 2 });
    }
    SCENE.snow(70);
    SCENE.portrait('sempronius', mood);
}

// The legions wade the freezing Trebia; the far bank is lost in fog
function drawRiver(){ SCENE.riverCrossing(); }

SCENE.run({
    script: SCRIPT,
    speakers: { sempronius: { label: 'Sempronius Longus', color: '#ef4444' } },
    speaker: 'sempronius',
    draw: (L) => {
        if(L.scene === 'tent') drawTent(L.mood);
        else if(L.scene === 'alarm') drawAlarm(L.mood);
        else drawRiver();
    }
});
</script>
</body>
</html>
