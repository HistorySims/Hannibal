<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Second Punic War – Campaign</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
html,body{
  margin:0;
  height:100%;
  background:#020617;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  overflow:hidden;
}

canvas{
  width:100vw;
  height:100vh;
  display:block;
  image-rendering: pixelated;
}

#hud{
  position:fixed;
  top:0; left:0; right:0;
  padding:12px 14px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  color:#fbbf24;
  background:linear-gradient(to bottom, rgba(2,6,23,0.85), rgba(2,6,23,0));
  pointer-events:none;
}

#progress{
  position:fixed;
  bottom:12px;
  left:50%;
  transform:translateX(-50%);
  font-size:12px;
  color:rgba(255,255,255,0.6);
  background:rgba(0,0,0,0.4);
  padding:4px 8px;
  border-radius:4px;
}

#modal{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  background:rgba(0,0,0,0.75);
}

#card{
  background:#0b0b0c;
  border:1px solid #fbbf24;
  padding:18px;
  width:min(90vw,420px);
  color:#e7e7ea;
}

#card h1{
  margin:0 0 10px 0;
  color:#fbbf24;
  font-size:18px;
}

/* On a landscape screen (a laptop or Chromebook) the map keeps its shape
   and this campaign panel sits beside it. */
#panel{
  position:fixed; display:none; box-sizing:border-box;
  width:300px; padding:22px 20px 20px;
  font-family:"Press Start 2P", ui-monospace, Menlo, Consolas, monospace;
  color:#f4ecd8; background:#161210;
  border:4px solid #1a1410; box-shadow:inset 0 0 0 3px rgba(244,236,216,0.85);
}
body.wide #panel{ display:block; }
body.wide #hud, body.wide #progress{ display:none; }
#panel .p-title{ color:#fbbf24; font-size:12px; line-height:1.6; letter-spacing:1px; }
#panel .p-sub{ color:#a89c88; font-size:8px; margin:6px 0 18px; }
#panel ol{ list-style:none; margin:0 0 18px; padding:0; }
#panel li{ display:flex; align-items:center; gap:10px; font-size:9px; line-height:1.4; padding:7px 0; color:#f4ecd8; }
#panel li .yr{ margin-left:auto; color:#a89c88; font-size:7px; white-space:nowrap; }
#panel li .mk{ flex:0 0 auto; width:8px; height:8px; background:#fbbf24; box-shadow:0 0 0 2px #1a1410; }
#panel li.done{ color:#a89c88; }
#panel li.done .mk{ background:rgba(251,191,36,0.5); }
#panel li.next .mk{ animation:p-blink 1s steps(2) infinite; }
#panel li.locked{ color:#5a5248; }
#panel li.locked .mk{ background:#3a342e; }
@keyframes p-blink{ 50%{ opacity:0; } }
#panel .p-go{
  display:block; width:100%; margin:0; padding:14px 10px;
  font-family:inherit; font-size:10px; line-height:1.5; color:#fff; text-transform:uppercase;
  background:#b83a24; border:3px solid #1a1410; border-radius:0; cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,0.35), inset 3px 3px 0 rgba(255,255,255,0.25), 0 4px 0 #000;
}
#panel .p-go:active{ transform:translateY(3px); box-shadow:inset -3px -3px 0 rgba(0,0,0,0.35), 0 1px 0 #000; }
#panel .p-hint{ margin-top:14px; font-size:7px; line-height:1.8; color:#a89c88; text-align:center; }

button{
  font-family:inherit;
  margin-top:12px;
  padding:8px 12px;
  background:#1e293b;
  border:1px solid #fbbf24;
  color:#f8fafc;
  cursor:pointer;
}
</style>
</head>

<body>

<canvas id="c"></canvas>

<div id="hud">
  <div>SECOND PUNIC WAR</div>
  <div>Campaign</div>
</div>

<div id="progress"></div>

<div id="panel">
  <div class="p-title">SECOND PUNIC WAR</div>
  <div class="p-sub">218 - 202 BC</div>
  <ol id="p-list"></ol>
  <button class="p-go" id="p-go"></button>
  <div class="p-hint" id="p-hint">ENTER to march · or click a marker</div>
</div>

<div id="modal">
  <div id="card">
    <h1 id="mTitle"></h1>
    <p id="mText"></p>
    <button id="closeBtn">Return to Map</button>
  </div>
</div>

<script src="campaign.js"></script>
<script>
/* ===================== CONFIG ===================== */

const MAP_SRC = "IMG_4198.jpeg"; 

/* Updated Coordinates */
const battles = [
  { id:"trebia",  name:"Trebia",         x:0.34, y:0.30 , url:"trebia_boot.html",   year:"218 BC"},
  { id:"tras",    name:"Lake Trasimene", x:0.49, y:0.41 , url:"tresimene_boot.html", year:"217 BC"},
  { id:"fabian",  name:"Fabian Tactics", x:0.53, y:0.53 , url:"fabius_boot.html",   year:"217 BC"},
  { id:"cannae",  name:"Cannae",         x:0.75, y:0.55 , url:"cannae_boot.html",   year:"216 BC"},
  { id:"zama",    name:"Zama",           x:0.18, y:0.83 , url:"zama_boot.html",     year:"202 BC"} 
];

/* ===================== HANNIBAL'S ROUTE ===================== */
// Waypoints (fractions of the map) tracing Hannibal's march, Mario-overworld style.
// `battle` marks a stop; `sea:true` means the leg arriving at this point is by ship.
const ROUTE = [
  { x:0.03, y:0.34 },                 // coming from Gaul
  { x:0.08, y:0.27 },                 // over the Alps
  { x:0.13, y:0.24 },
  { x:0.19, y:0.28 },                 // down into the Po valley
  { x:0.27, y:0.29 },
  { x:0.34, y:0.30, battle:0 },       // Trebia
  { x:0.40, y:0.33 },                 // across the Apennines
  { x:0.45, y:0.37 },
  { x:0.49, y:0.41, battle:1 },       // Lake Trasimene
  { x:0.52, y:0.47 },
  { x:0.53, y:0.53, battle:2 },       // Fabius shadows him through Campania
  { x:0.61, y:0.52 },
  { x:0.69, y:0.54 },
  { x:0.75, y:0.55, battle:3 },       // Cannae
  { x:0.76, y:0.60 },
  { x:0.79, y:0.66 },                 // Croton: sail for Africa
  { x:0.80, y:0.75, sea:true },
  { x:0.66, y:0.88, sea:true },
  { x:0.42, y:0.90, sea:true },
  { x:0.26, y:0.86, sea:true },       // land near Hadrumetum
  { x:0.18, y:0.83, battle:4 },       // Zama
];
const START_STOP = -1;                // before Trebia: at the route's first point
const WALKER_KEY = "spw_walker_at";   // which stop the little guy last stood at

function routeIndexOfStop(stop){
  if(stop === START_STOP) return 0;
  return ROUTE.findIndex(p => p.battle === stop);
}

/* ===================== WALKER SPRITE ===================== */
// Hannibal on his elephant, facing right. Two leg frames for the walk cycle.
const SPR_PAL = {
  h:"#d4a017", H:"#8a5a00", s:"#c68642", p:"#7e22ce", P:"#4c1d95",
  r:"#b91c1c", y:"#fbbf24", g:"#9ca3af", G:"#6b7280", d:"#374151",
  w:"#f8fafc", k:"#111111"
};
const SPR_TOP = [
  ".........hH...........",
  "........hhhH..........",
  "........sssk..........",
  ".......ppppP..........",
  "......pppppPP.........",
  ".....yrrrrrrrry.......",
  "....grrrrrrrrrrgg.....",
  "...ggyyyyyyyyyygGGgg..",
  "..gggggggggggggGGGgkg.",
  ".ggggggggggggggGGGgggg",
  "dgggggggggggggggGGgwgg",
  "dgggggggggggggggggwwGg",
  ".ggggggggggggggggg..Gg",
  ".gggggggggggggggg...Gg",
  "..gggggggggggggg....gG",
];
const SPR_LEGS = [
  [ "..ggg..ggg..ggg..ggg..",
    "..ggg..ggg..ggg..ggg..",
    "..GGG..GGG..GGG..GGG.." ],
  [ "...ggg..ggg.ggg..ggg..",
    "...ggg..ggg.ggg..ggg..",
    "...GGG..GGG.GGG..GGG.." ],
];
const SPR_W = 22;

function drawPixels(rows, ox, oy, S, flip, colorOverride){
  for(let r=0;r<rows.length;r++){
    const row = rows[r];
    for(let c=0;c<row.length;c++){
      const ch = row[c];
      if(ch === ".") continue;
      ctx.fillStyle = colorOverride || SPR_PAL[ch];
      const cx = flip ? (SPR_W-1-c) : c;
      ctx.fillRect(ox + cx*S, oy + r*S, S, S);
    }
  }
}

function drawWalker(x, y, S, frame, flip, atSea, t){
  const rows = atSea ? SPR_TOP : SPR_TOP.concat(SPR_LEGS[frame]);
  const h = rows.length;
  const bob = atSea ? Math.round(Math.sin(t*3)*1.5)*S/2 : 0;
  const ox = Math.round(x - (SPR_W*S)/2);
  const oy = Math.round(y - h*S + bob - (atSea ? 3*S : 0));

  // ground shadow
  if(!atSea){
    ctx.fillStyle = "rgba(0,0,0,0.35)";
    ctx.beginPath(); ctx.ellipse(x, y, 9*S, 2*S, 0, 0, Math.PI*2); ctx.fill();
  }
  // 1px dark outline so he reads on any terrain
  for(const [dx,dy] of [[-1,0],[1,0],[0,-1],[0,1]]){
    drawPixels(rows, ox+dx*S, oy+dy*S, S, flip, "#0b0b0c");
  }
  drawPixels(rows, ox, oy, S, flip);

  if(atSea){
    // little galley under the elephant
    const hy = oy + (h-1)*S;
    ctx.fillStyle = "#0b0b0c";
    ctx.fillRect(ox - 3*S, hy - S, (SPR_W+6)*S, 6*S);
    ctx.fillStyle = "#78350f"; ctx.fillRect(ox - 2*S, hy, (SPR_W+4)*S, 4*S);
    ctx.fillStyle = "#b45309"; ctx.fillRect(ox - 2*S, hy, (SPR_W+4)*S, S);
    ctx.fillStyle = "#f8fafc";
    const wave = Math.floor(t*6)%2;
    for(let i=0;i<SPR_W+4;i+=4) ctx.fillRect(ox + (i-2+wave)*S, hy + 5*S, 2*S, S);
  }
}

/* ===================== WALKER STATE ===================== */
const walker = {
  pos: 0,            // fractional index along ROUTE
  target: 0,
  frame: 0, animT: 0,
  flip: false,
  onArrive: null,
};
const WALK_SPEED_PX = 70;   // screen pixels per second

function walkTo(routeIdx, onArrive){
  walker.target = routeIdx;
  walker.onArrive = onArrive || null;
}
function isWalking(){ return Math.abs(walker.pos - walker.target) > 1e-6; }

function routePoint(i){
  return toScreen(ROUTE[i]);
}
function walkerXY(){
  const i = Math.floor(walker.pos), f = walker.pos - i;
  const A = routePoint(i), B = routePoint(Math.min(i+1, ROUTE.length-1));
  return { x: A.x + (B.x-A.x)*f, y: A.y + (B.y-A.y)*f };
}
function walkerAtSea(){
  // the leg currently being travelled is a sea leg
  const i = Math.floor(walker.pos), f = walker.pos - i;
  if(f < 1e-6) return !!ROUTE[i].sea && !!(ROUTE[i+1]||{}).sea;
  return !!(ROUTE[i+1] && ROUTE[i+1].sea);
}

function updateWalker(dt){
  if(!isWalking()){ walker.frame = 0; return; }
  const dir = Math.sign(walker.target - walker.pos);
  let budget = WALK_SPEED_PX * dt;
  while(budget > 0 && isWalking()){
    const i = dir > 0 ? Math.floor(walker.pos + 1e-9) : Math.ceil(walker.pos - 1e-9) - 1;
    const A = routePoint(i), B = routePoint(i+1);
    const segLen = Math.max(1, Math.hypot(B.x-A.x, B.y-A.y));
    walker.flip = (B.x - A.x) * dir < 0;
    const stepT = budget / segLen;
    const edge = dir > 0 ? i+1 : i;
    const limit = dir > 0 ? Math.min(edge, walker.target) : Math.max(edge, walker.target);
    const room = Math.abs(limit - walker.pos);
    if(stepT >= room){ walker.pos = limit; budget -= room*segLen; }
    else { walker.pos += dir*stepT; budget = 0; }
  }
  walker.animT += dt;
  walker.frame = Math.floor(walker.animT*6) % 2;
  if(!isWalking() && walker.onArrive){
    const cb = walker.onArrive; walker.onArrive = null;
    setTimeout(cb, 350);
  }
}

function saveWalkerStop(stop){
  try { localStorage.setItem(WALKER_KEY, String(stop)); } catch(e){}
}
function loadWalkerStop(){
  try {
    const v = localStorage.getItem(WALKER_KEY);
    return v === null ? START_STOP : parseInt(v, 10);
  } catch(e){ return START_STOP; }
}

/* ===================== SETUP ===================== */

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
ctx.imageSmoothingEnabled = false;

const modal = document.getElementById("modal");
const mTitle = document.getElementById("mTitle");
const mText  = document.getElementById("mText");
const closeBtn = document.getElementById("closeBtn");
const progressLine = document.getElementById("progress");

let mapImg = new Image();
mapImg.src = MAP_SRC;

// Progress is written by each battle when it is fought to its end (campaign.js)
let state = spwLoad();

// Where the map picture sits on screen. On a phone it fills the screen
// (a little stretch is fine); on a landscape screen it keeps its shape,
// full height, with the campaign panel beside it.
const MAP_ASPECT = 295/480;
const PANEL_W = 300, PANEL_GAP = 28;
let M = { x:0, y:0, w:1, h:1 };
function toScreen(p){ return { x: M.x + p.x*M.w, y: M.y + p.y*M.h }; }
function layoutMap(){
  const W = canvas.width, H = canvas.height;
  const stretch = (W/H) / MAP_ASPECT;
  const wide = stretch > 1.25;
  document.body.classList.toggle('wide', wide);
  if(!wide){ M = { x:0, y:0, w:W, h:H }; return; }
  const pad = 14;
  let h = H - pad*2, w = Math.round(h*MAP_ASPECT);
  const total = w + PANEL_GAP + PANEL_W;
  const x = Math.max(pad, Math.round((W - total)/2));
  M = { x, y: pad, w, h };
  const panel = document.getElementById('panel');
  panel.style.left = (x + w + PANEL_GAP) + 'px';
  panel.style.top = Math.max(pad, Math.round(H/2 - panel.offsetHeight/2)) + 'px';
}
function resize(){
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  layoutMap();
  if(mapImg.complete) draw();
}
window.addEventListener("resize", resize);

/* ===================== HELPERS ===================== */

function nextIndex(){
  for(let i=0;i<battles.length;i++){
    if(!state[battles[i].id]) return i;
  }
  return battles.length;
}

function drawMarker(x,y,active){
  // Active = the next battle to fight (bright yellow)
  // Inactive = past battles (faded)
  ctx.fillStyle = active ? "#fbbf24" : "rgba(251,191,36,0.5)";
  
  // Cross shape
  ctx.fillRect(x-6,y-18,12,36);
  ctx.fillRect(x-18,y-6,36,12);
}

function drawArrow(ax,ay,bx,by){
  ctx.strokeStyle = "#ef4444";
  ctx.lineWidth = 4;
  ctx.beginPath();
  ctx.moveTo(ax,ay);
  ctx.lineTo(bx,by);
  ctx.stroke();
}

/* ===================== DRAW ===================== */

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // 1. Map (framed like the cutscene text boxes when it doesn't fill the screen)
  if(document.body.classList.contains('wide')){
    ctx.fillStyle = "#0b0b0c"; ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.fillStyle = "#1a1410"; ctx.fillRect(M.x-7, M.y-7, M.w+14, M.h+14);
    ctx.fillStyle = "rgba(244,236,216,0.85)"; ctx.fillRect(M.x-4, M.y-4, M.w+8, M.h+8);
    ctx.fillStyle = "#1a1410"; ctx.fillRect(M.x-1, M.y-1, M.w+2, M.h+2);
  }
  ctx.drawImage(mapImg, M.x, M.y, M.w, M.h);

  const unlocked = nextIndex();

  // 2. Dotted trail along the route, up to the next battle (no spoilers beyond it)
  const trailEnd = routeIndexOfStop(Math.min(unlocked, battles.length-1));
  for(let i=0;i<trailEnd;i++){
    const A = routePoint(i), B = routePoint(i+1);
    const sea = !!ROUTE[i+1].sea;
    const len = Math.hypot(B.x-A.x, B.y-A.y);
    const n = Math.max(1, Math.floor(len / 10));
    for(let k=0;k<n;k++){
      const f = k/n;
      const x = Math.round(A.x + (B.x-A.x)*f), y = Math.round(A.y + (B.y-A.y)*f);
      ctx.fillStyle = "#0b0b0c"; ctx.fillRect(x-3, y-3, 6, 6);
      ctx.fillStyle = sea ? "#e0f2fe" : "#fbbf24"; ctx.fillRect(x-2, y-2, 4, 4);
    }
  }

  // 3. Markers
  battles.forEach((b,i)=>{
    // Don't draw future locked battles
    if(i > unlocked) return;

    const { x, y } = toScreen(b);
    drawMarker(x,y,i===unlocked);
  });

  // 4. Hannibal and his elephant
  const S = Math.max(2, Math.round(Math.min(M.w, M.h) / 260));
  const wp = walkerXY();
  drawWalker(wp.x, wp.y, S, walker.frame, walker.flip, walkerAtSea(), performance.now()/1000);

  // 5. Labels on top so the walker never hides them
  ctx.font="bold 13px ui-monospace, monospace";
  ctx.textAlign="center";
  battles.forEach((b,i)=>{
    if(i > unlocked) return;
    const { x, y } = toScreen(b);
    ctx.fillStyle="#000"; ctx.fillText(b.name, x+1, y+33);
    ctx.fillStyle="#fff"; ctx.fillText(b.name, x, y+32);
  });

  const done = battles.filter(b=>state[b.id]).length;
  if(done >= battles.length){
    progressLine.innerHTML = `Campaign complete · <a href="victory.html" style="color:#fbbf24">Epilogue ▶</a>`;
  } else {
    progressLine.textContent = `Progress: ${done}/${battles.length}`;
  }
}

let lastT = performance.now();
function frame(now){
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  updateWalker(dt);
  if(mapImg.complete && mapImg.naturalWidth) draw();
  requestAnimationFrame(frame);
}

// On arrival: stand where we last stopped, then march to the next battle
(function initWalker(){
  const from = loadWalkerStop();
  const to = Math.min(nextIndex(), battles.length-1);
  walker.pos = walker.target = routeIndexOfStop(from);
  if(to !== from){
    // (unless a battle was already chosen and he is on his way)
    setTimeout(()=>{ if(!isWalking()) walkTo(routeIndexOfStop(to), ()=>saveWalkerStop(to)); }, 600);
  }
})();
requestAnimationFrame(frame);

/* ===================== INTERACTION ===================== */

// Which battle marker (if any) is under the pointer
function markerAt(e){
  const r = canvas.getBoundingClientRect();
  const sx = (e.clientX-r.left) * canvas.width / r.width, sy = (e.clientY-r.top) * canvas.height / r.height;
  const mx = (sx - M.x)/M.w, my = (sy - M.y)/M.h;
  const aspect = M.w / M.h;   // a round radius on screen, whatever the map's shape
  const unlocked = nextIndex();
  for(let i=0;i<=Math.min(unlocked, battles.length-1);i++){
    const dx = mx - battles[i].x, dy = (my - battles[i].y) / aspect;
    if(dx*dx + dy*dy < 0.003) return i;   // about 5% of the map's width
  }
  return -1;
}
canvas.addEventListener("pointerup", e=>{ const i = markerAt(e); if(i >= 0) openBattle(i); });
// a hand over the markers, for a mouse or touchpad
canvas.addEventListener("pointermove", e=>{ canvas.style.cursor = markerAt(e) >= 0 ? "pointer" : "default"; });

// March to the next battle (the panel's button and the Enter key)
function marchOn(){
  const i = nextIndex();
  if(i >= battles.length){ window.location.href = "victory.html"; return; }
  openBattle(i);
}
document.getElementById('p-go').addEventListener('click', marchOn);
window.addEventListener('keydown', e=>{
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); if(modal.style.display !== 'flex') marchOn(); }
});

function buildPanel(){
  const next = nextIndex();
  document.getElementById('p-list').innerHTML = battles.map((b,i)=>{
    if(i > next) return `<li class="locked"><span class="mk"></span>? ? ?</li>`;
    const cls = state[b.id] ? 'done' : (i === next ? 'next' : '');
    return `<li class="${cls}"><span class="mk"></span>${b.name}<span class="yr">${b.year}</span></li>`;
  }).join('');
  const go = document.getElementById('p-go');
  if(next >= battles.length){
    go.textContent = 'Epilogue';
    document.getElementById('p-hint').textContent = 'ENTER for the epilogue';
  } else {
    go.textContent = 'March to ' + battles[next].name;
  }
}

function openBattle(i){
  const dest = routeIndexOfStop(i);
  if(isWalking()){
    // already on his way there: go straight in when he arrives
    if(Math.abs(walker.target - dest) < 1e-6) walker.onArrive = ()=>{ saveWalkerStop(i); enterBattle(i); };
    return;
  }
  if(Math.abs(walker.pos - dest) > 1e-6){
    walkTo(dest, ()=>{ saveWalkerStop(i); enterBattle(i); });
    return;
  }
  saveWalkerStop(i);
  enterBattle(i);
}

function enterBattle(i){
  const b = battles[i];
  
  // Battles are marked done by the battle itself when it ends (win or lose).
  if(b.url){
    window.location.href = b.url;
    return;
  }

  mTitle.textContent = b.name;
  mText.textContent = `${b.name} placeholder screen. Click below to return.`;
  modal.style.display="flex";
}

closeBtn.onclick = ()=>{
  modal.style.display="none";
  draw();
};

/* Initial resize to set it up */
buildPanel();
resize();
// the pixel font changes the panel's height once it arrives
if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ layoutMap(); });

</script>
</body>
</html>
