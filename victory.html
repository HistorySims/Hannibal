<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Victory: The Aftermath</title>
<style>
    body {
        margin: 0; padding: 0; background: #000;
        min-height: 100vh; 
        display: flex; align-items: center; justify-content: center;
        font-family: 'Courier New', Courier, monospace; 
    }
    #stage {
        display: flex; flex-direction: column;
        position: relative; width: 100%; max-width: 800px; 
        background: #1a1a1c; 
        border: 2px solid #555;
        box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    canvas { 
        display: block; width: 100%; 
        aspect-ratio: 4/3;
        image-rendering: pixelated; 
        flex-shrink: 0;
    }
    
    /* DIALOGUE BOX */
    #dialogue-box {
        position: relative;
        width: 100%; background: #111; 
        border-top: 4px solid #f59e0b; 
        padding: 20px; z-index: 30;
        cursor: pointer; 
        height: 150px; 
        box-sizing: border-box;
        flex-shrink: 0;
    }
    .speaker-name {
        color: #f59e0b; font-weight: 900; font-size: 16px; text-transform: uppercase;
        margin-bottom: 10px; letter-spacing: 2px;
    }
    .speech-text {
        color: #e7e7ea; font-size: 18px; line-height: 1.4; white-space: pre-wrap;
    }
    .click-prompt {
        position: absolute; bottom: 10px; right: 20px;
        font-size: 12px; color: #fbbf24; animation: blink 1s infinite;
    }

    /* END SCREEN */
    #title-screen {
        position: absolute; inset: 0; 
        background: #e5e5e5; 
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 50; text-align: center;
        opacity: 0; transition: opacity 3s;
    }
    h1 { 
        font-size: 64px; color: #b91c1c; margin: 0; 
        text-transform: uppercase; letter-spacing: 10px; 
        text-shadow: 0 4px 0 #bbb;
    }
    h2 { font-size: 14px; color: #555; margin-top: 20px; letter-spacing: 4px; font-weight:800; }
    
    .restart-btn {
        margin-top: 40px;
        background: transparent; color: #333; border: 2px solid #333;
        padding: 10px 20px; font-size: 16px; font-weight: 900; cursor: pointer;
        text-transform: uppercase; 
        transition: all 0.3s;
    }
    .restart-btn:hover { background: #333; color: #fff; }

    @keyframes blink { 50% { opacity: 0; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boot.css">
</head>
<body>

<div id="stage">
    <canvas id="cv"></canvas>
    
    <div id="dialogue-box" onclick="nextLine()">
        <div class="speaker-name" id="speaker">Narrator</div>
        <div class="speech-text" id="speech"></div>
        <div class="click-prompt">TAP TO CONTINUE ▼</div>
    </div>

    <div id="title-screen">
        <h1>ROMA<br>VICTRIX</h1>
        <h2>The World is Yours</h2>
        <button class="restart-btn" onclick="hardReset()">Replay History</button>
    </div>
</div>

<script src="controls.js"></script>
<script src="pixel.js"></script>
<script src="scene.js"></script>
<script>
const SCRIPT = [
    { scene: 'aftermath', speaker: 'narrator', text: "The dust settles over Zama. The roar of the elephants is silenced forever." },
    { scene: 'aftermath', speaker: 'scipio',   mood: 'grim',  text: "It is done. Hannibal is broken." },
    { scene: 'carthage',  speaker: 'hannibal', mood: 'grim',  text: "I have not lost a battle... I have lost the war." },
    { scene: 'carthage',  speaker: 'hannibal', mood: 'tired', text: "We must surrender. We must pay their price, or Carthage will burn." },
    { scene: 'triumph',   speaker: 'narrator', text: "Scipio returns to Rome. The city erupts in celebration." },
    { scene: 'triumph',   speaker: 'crowd',    text: "SCIPIO! SCIPIO AFRICANUS! CONQUEROR OF AFRICA!" },
    { scene: 'harbor',    speaker: 'narrator', text: "Carthage is stripped of its fleet. Its empire is gone." },
    { scene: 'sea',       speaker: 'narrator', text: "The Mediterranean is no longer a sea of war. It is a Roman lake." },
    { scene: 'statue',    speaker: 'narrator', text: "The Republic is safe. But the taste of Empire... has only just begun." }
];

function hardReset(){
    localStorage.removeItem("spw_campaign_progress_v1");
    localStorage.removeItem("spw_walker_at");
    window.location.href = "index.html";
}

// The field at Zama at sunset: fallen elephants, broken spears, vultures overhead
function drawAftermath(L){
    SCENE.sky([[0,'#2a1a3a'],[22,'#5a2a4a'],[42,'#a04a4a'],[58,'#e07a4a'],[70,'#f8b860']]);
    SCENE.rect(40, 62, 14, 8, '#fde0a0'); SCENE.rect(42, 60, 10, 2, '#fde0a0');      // the sinking sun
    PX.ground(16, 20, (x, y) => y*8 >= 72 ? 'sand' : null);
    SCENE.rect(0, 72, 128, 88, 'rgba(120,40,20,0.25)');
    const t = PX.t;
    // fallen elephants, lying on their sides
    const g = SCENE.ctx;
    for(const [x, y, f] of [[26, 100, 1], [94, 124, -1]]){
        SCENE.rect(x - 14, y + 6, 30, 3, 'rgba(60,10,10,0.55)');
        g.save(); g.translate(x, y); g.rotate(f * Math.PI/2); PX.figure('elephant', -12, -8, { face: f }); g.restore();
    }
    for(let i=0; i<10; i++){ const x = 6 + (i*37) % 116, y = 80 + (i*23) % 70; SCENE.rect(x, y, 7, 1, '#6a4a2a'); SCENE.px(x + 7, y, '#b8c0c8'); }   // broken spears
    for(const [x, y] of [[52, 88], [104, 92]]) PX.pic('standard', x/8 - 0.5, y/8 - 1);
    for(let i=0; i<3; i++){                                                        // vultures circling
        const a = t/60 + i*2.1, vx = 70 + Math.cos(a)*30, vy = 30 + Math.sin(a)*10;
        const flap = Math.floor((t + i*10)/10) % 2;
        SCENE.px(vx, vy, '#1a1414'); SCENE.px(vx - 1, vy - flap, '#1a1414'); SCENE.px(vx + 1, vy - flap, '#1a1414'); SCENE.px(vx - 2, vy - 1 + flap, '#1a1414'); SCENE.px(vx + 2, vy - 1 + flap, '#1a1414');
    }
    SCENE.mist(78, 20, 0.25, '240,190,140');
    if(L.speaker === 'scipio') SCENE.portrait('scipio', L.mood);
}

// Hannibal in Carthage, at night, by brazier light
function drawCarthage(L){
    SCENE.rect(0, 0, 128, 160, '#160e1e');
    SCENE.rect(44, 14, 40, 54, '#0a1428');                                          // a tall window
    SCENE.stars(14, 16, 64, 21);
    SCENE.rect(70, 22, 6, 6, '#e8ecf0'); SCENE.rect(71, 21, 4, 1, '#e8ecf0');        // the moon
    SCENE.rect(44, 14, 40, 2, '#2a1a34'); SCENE.rect(62, 14, 2, 54, '#2a1a34');
    SCENE.columns(6, 4, 104, 2, 98, '#5a4466', '#3a2a46');
    for(const x of [22, 100]){                                                       // purple hangings
        for(let y=0; y<70; y++) SCENE.rect(x + Math.round(Math.sin(y/9 + PX.t/50)), y, 8, 1, y%6 ? '#5a2a7a' : '#4a1e66');
        SCENE.rect(x, 70, 8, 2, '#f8d048');
    }
    for(const x of [18, 108]){                                                       // braziers
        SCENE.rect(x - 4, 106, 9, 4, '#6a4418'); SCENE.rect(x - 1, 110, 3, 10, '#4a3214');
        SCENE.glow(x, 100, 26, '255,150,60', 0.3); SCENE.fire(x, 104, 1.6);
    }
    SCENE.rect(0, 124, 128, 36, '#24182c');
    SCENE.portrait('hannibal', L.mood);
}

// Scipio's triumph through Rome
function drawTriumph(){
    SCENE.sky([[0,'#5a9ad8'],[40,'#8ab8e4'],[64,'#c8dcec']]);
    // the triumphal arch
    SCENE.rect(36, 20, 56, 64, '#d8d0bc'); SCENE.rect(52, 40, 24, 44, '#6a8ab0');
    SCENE.rect(32, 16, 64, 6, '#c4bca4'); SCENE.rect(40, 26, 48, 4, '#b4ac94');
    for(const x of [40, 82]) SCENE.rect(x, 30, 4, 54, '#ece6d4');
    SCENE.rect(56, 22, 16, 3, '#f8d048');
    PX.ground(16, 20, (x, y) => y*8 >= 84 ? 'road' : null);
    const t = PX.t;
    for(let side=0; side<2; side++) for(let i=0; i<9; i++){                        // the crowd, cheering
        const x = side ? 100 + (i%3)*9 : 4 + (i%3)*9, y = 86 + Math.floor(i/3)*14;
        const jump = ((t + i*7 + side*13) % 30) < 8 ? 1 : 0;
        SCENE.tiny(x, y - jump, ['#c03028','#ece6d4','#3a6ab0','#e0a848'][(i + side) % 4]);
        if(jump) SCENE.px(x + 1, y - 3, '#e0a878');
    }
    // the procession: legionaries, then Scipio in his chariot
    const p = (t*0.3) % 40;
    for(let r=0; r<3; r++) for(const c of [0, 1]) PX.figure('roman', 46 + c*16, 148 - r*14 - p, {});
    const cy = 100 - p*0.2;
    PX.figure('romcav', 50, cy, { face:1, frame: Math.floor(t/8)%2 }); PX.figure('romcav', 66, cy, { face:1, frame: Math.floor(t/8)%2 });
    SCENE.rect(54, cy + 9, 18, 7, '#f8d048'); SCENE.rect(54, cy + 9, 18, 1, '#fff4b0');
    PX.figure('yours', 59, cy + 1, {});
    for(let i=0; i<24; i++){                                                         // petals
        const x = (i*29 + t*0.4) % 128, y = (i*17 + t*0.8) % 160;
        SCENE.px(x, y, ['#ef4444','#fde047','#f8fafc'][i%3]);
    }
}

// Carthage's fleet burns in its harbour
function drawHarbor(){
    SCENE.sky([[0,'#1a1028'],[30,'#3a1a30'],[52,'#7a2a2a']]);
    SCENE.rect(0, 50, 128, 14, '#2a1a1e');
    for(let x=0; x<128; x+=10){ SCENE.rect(x, 42 + (x%20 ? 0 : -6), 8, 10, '#2a1a1e'); }   // the city walls
    SCENE.water(62, 98, '#1a2a4a', '#c86a3a');
    for(const [x, y] of [[4, 70], [52, 86], [14, 112], [70, 124], [90, 76]]) SCENE.ship(x, y, { burning: true, sail:'#5a2a7a', stripe:'#f8d048' });
    SCENE.glow(40, 96, 28, '255,120,40', 0.12); SCENE.glow(90, 110, 24, '255,120,40', 0.1);
}

// A Roman sea
function drawSea(){
    SCENE.sky([[0,'#3a7ac8'],[40,'#6aa0dc'],[58,'#b8d4ec']]);
    SCENE.water(60, 100, '#1e5a9a', '#7ab0e0');
    for(const [x, y] of [[0, 66], [44, 84], [10, 106], [70, 120], [30, 136]]) SCENE.ship((x + PX.t*0.1) % 160 - 24, y, { stripe:'#c03028' });
    PX.text('MARE NOSTRUM', 64, 26, '#ffffff');
    PX.text('OUR SEA', 64, 36, '#fde68a');
}

// Rome at dusk, watched over by Victory
const VICTORY = [
    "..........yyyy..........",
    ".........y....y.........",
    ".........y....y.........",
    "..........yyyy..........",
    "...........aa...........",
    "...........aa...........",
    "...........aa.....w.....",
    ".w.........aa....ww.....",
    ".ww........aa...www.....",
    ".www......hhhh.wwww.....",
    ".wwww.....hhhh.wwwww....",
    ".wwwww....hhhh.wwwwww...",
    "..wwwww..bbbbbbwwwwww...",
    "..wwwwwwbbbbbbbbwwwww...",
    "...wwwwwbbbbbbbbwwww....",
    "....wwwwbbbbbbbbwww.....",
    ".....www.bbbbbb.ww......",
    "......ww.bbbbbb..w......",
    ".........bbbbbb.........",
    "........bbbbbbbb........",
    "........bbbbbbbb........",
    ".......bbbbbbbbbb.......",
    ".......bbbbbbbbbb.......",
    "......bbbbbbbbbbbb......",
    "......bbbbbbbbbbbb......",
    ".....bbbbbbbbbbbbbb.....",
    ".....bbbbbbbbbbbbbb.....",
    "....bbbbbbbbbbbbbbbb....",
    "....pppppppppppppppp....",
];
function drawStatue(){
    SCENE.sky([[0,'#140e28'],[30,'#2a1e48'],[52,'#5a3a62'],[66,'#b06a5a']]);
    SCENE.stars(24, 0, 50, 5);
    SCENE.rome(116);
    SCENE.rect(0, 116, 128, 44, '#1a1424');
    SCENE.rect(80, 104, 40, 56, '#3a3040'); SCENE.rect(78, 100, 44, 5, '#4a4052'); SCENE.rect(80, 104, 40, 2, '#2a2234');
    const cv = SCENE.art('victory', VICTORY, { y:'#f8d048', a:'#3a2e22', w:'#4a3a2a', h:'#3a2e22', b:'#2e2418', p:'#4a4052' });
    SCENE.ctx.drawImage(cv, 88, 100 - cv.height + 1);
    if(PX.t % 120 < 60) SCENE.px(98, 51, '#fff4b0');                               // the wreath catches the last light
}

SCENE.run({
    script: SCRIPT,
    speakers: {
        narrator: { label: 'Narrator', color: '#e7e5e4' },
        scipio:   { label: 'Scipio',   color: '#4ade80' },
        hannibal: { label: 'Hannibal', color: '#60a5fa' },
        crowd:    { label: 'Crowd',    color: '#fbbf24' },
    },
    draw: (L) => {
        switch(L.scene){
            case 'aftermath': return drawAftermath(L);
            case 'carthage':  return drawCarthage(L);
            case 'triumph':   return drawTriumph();
            case 'harbor':    return drawHarbor();
            case 'sea':       return drawSea();
            default:          return drawStatue();
        }
    }
});
</script>
</body>
</html>
