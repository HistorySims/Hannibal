<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Cannae: The Pivot</title>
<style>
    body {
        margin: 0; padding: 0; background: #000;
        height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Courier New', Courier, monospace; overflow: hidden;
    }
    #stage {
        position: relative; width: 100%; max-width: 600px; 
        /* CHANGED: Portrait for better framing */
        aspect-ratio: 3/4;
        background: #111; overflow: hidden;
        border: 2px solid #333;
        box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    
    /* DIALOGUE BOX */
    #dialogue-box {
        position: absolute; bottom: 0; left: 0;
        width: 100%; background: #1f1f1f; 
        border-top: 4px solid #b91c1c; 
        padding: 15px 20px; display: none; z-index: 30;
        cursor: pointer; height: 130px;
        box-sizing: border-box;
    }
    .speaker-name {
        font-weight: 900; font-size: 16px; text-transform: uppercase;
        margin-bottom: 8px; letter-spacing: 2px;
    }
    .speech-text {
        color: #e7e7ea; font-size: 17px; line-height: 1.3; white-space: pre-wrap;
    }
    .click-prompt {
        position: absolute; bottom: 10px; right: 20px;
        font-size: 12px; color: #777; animation: blink 1s infinite;
    }

    /* TITLE SCREEN */
    #title-screen {
        position: absolute; inset: 0; 
        background: #7f1d1d; 
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 50; text-align: center;
        opacity: 0; transition: opacity 2s;
    }
    h1 { 
        font-size: 64px; color: #fbbf24; margin: 0; 
        text-transform: uppercase; letter-spacing: 4px; 
        text-shadow: 0 4px 0 #000;
    }
    h2 { font-size: 18px; color: #fff; margin-bottom: 30px; letter-spacing: 2px; font-weight:800; }
    
    button {
        background: #111; color: #fff; border: 4px solid #fff;
        padding: 15px 40px; font-size: 20px; font-weight: 900; cursor: pointer;
        text-transform: uppercase; 
        box-shadow: 0 6px 0 #000;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #000; }

    @keyframes blink { 50% { opacity: 0; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boot.css">
</head>
<body>

<div id="stage">
    <canvas id="cv"></canvas>
    
    <div id="dialogue-box" onclick="nextLine()">
        <div class="speaker-name" id="speaker">Name</div>
        <div class="speech-text" id="speech"></div>
        <div class="click-prompt">TAP TO CONTINUE ▼</div>
    </div>

    <div id="title-screen">
        <h1>CANNAE</h1>
        <h2>The Slaughter Begins</h2>
        <button onclick="window.location.href='cannae_game.html'">Start Battle</button>
        <button onclick="window.location.href='map.html'" style="margin-top:15px; background:#475569; box-shadow:0 4px 0 #334155;">Back to Map</button>
    </div>
</div>

<script src="controls.js"></script>
<script src="pixel.js"></script>
<script src="scene.js"></script>
<script>
const SCRIPT = [
    { scene: 'council', speaker: 'fabius',  mood: 'tired', text: "My Dictatorship is over. I hand the legions back to you, Consuls." },
    { scene: 'council', speaker: 'fabius',  mood: 'tired', text: "I kept Rome safe by waiting. Do not undo my work in a single afternoon." },
    { scene: 'council', speaker: 'varro',   mood: 'angry', text: "Safe? You call burning fields safe? The people are starving, Fabius!" },
    { scene: 'council', speaker: 'varro',   mood: 'yell',  text: "No more delays! No more running! Rome elected ME to end this war." },
    { scene: 'council', speaker: 'paullus', mood: 'worry', text: "Varro, caution. We have the numbers, but the plain is flat. We should..." },
    { scene: 'council', speaker: 'varro',   mood: 'smug',  text: "Caution is for old men! Today I hold the command." },
    { scene: 'army',    speaker: 'varro',   mood: 'smug',  text: "Look at this army. Eighty thousand men! The largest force in history!" },
    { scene: 'tight',   speaker: 'varro',   mood: 'yell',  text: "Pack them tight! Shoulder to shoulder! Make a wall of flesh!" },
    { scene: 'field',   speaker: 'varro',   mood: 'yell',  text: "We will punch straight through their center! CRUSH THEM!" }
];

const SUMMER = [[0,'#4a8ac8'],[30,'#6aa0d4'],[52,'#9cc0e0'],[66,'#d8dcc8']];

// The consuls in the camp on the flat, dusty Apulian plain
function drawCouncil(L){
    SCENE.camp(SUMMER, { groundTile:'plain', hill:'#7a8a6a', hillTop:'#9aa882' });
    SCENE.mist(84, 10, 0.25, '230,214,170');                  // summer dust
    for(let x=0; x<128; x+=3){ SCENE.rect(x, 92, 2, 9, '#6a4a2a'); SCENE.px(x, 91, '#8a6a42'); }   // the camp palisade
    SCENE.rect(0, 98, 128, 1, '#4a3420');
    for(const x of [6, 112]) PX.figure('roman', x, 112, {});          // guards at the general's tent
    for(const x of [24, 98]) PX.pic('standard', x/8 - 0.5, 104/8 - 1);
    SCENE.portrait(L.speaker, L.mood);
}

// Hannibal's thin crescent, bulging towards the Romans
function crescent(y0, depth){
    const men = [];
    for(let i=0; i<15; i++){
        const x = 4 + i*8, u = (x + 4 - 64) / 60;
        men.push({ x, y: y0 + Math.round(depth * (1 - u*u)), k: i%2 ? 'gaul' : 'spaniard' });
    }
    for(const m of men) PX.figure(m.k, m.x, m.y, {});
    for(const x of [0, 116]) for(let r=0; r<2; r++) PX.figure('libyan', x + r*2, y0 - 4 + r*7, {});
}

// The great Roman army, seen from behind; `squeeze` packs the ranks together
function drawArmy(squeeze){
    PX.ground(16, 20, () => 'plain');
    SCENE.mist(0, 30, 0.3, '230,214,170');
    crescent(8, 12);
    const p = Math.min(1, squeeze);
    const dx = Math.round(10 - 3*p), dy = Math.round(9 - 3*p);
    const cols = Math.floor(128 / dx) + 1, rows = Math.floor(120 / dy) + 2;
    const x0 = Math.round(64 - (cols*dx)/2);
    SCENE.formation('roman', x0, 46, cols, rows, dx, dy, { back:true, stagger:true, walk: squeeze > 0 && squeeze < 1 });
    SCENE.mist(120, 40, 0.18, '230,214,170');
}

function drawField(L){
    drawArmy(1);
    SCENE.rect(0, 0, 128, 160, 'rgba(0,0,0,0.25)');
    SCENE.portrait('varro', L.mood);
}

SCENE.run({
    script: SCRIPT,
    speakers: {
        fabius:  { label: 'Fabius',  color: '#f59e0b' },
        varro:   { label: 'Varro',   color: '#ef4444' },
        paullus: { label: 'Paullus', color: '#60a5fa' },
    },
    draw: (L) => {
        if(L.scene === 'council') drawCouncil(L);
        else if(L.scene === 'army') drawArmy(0);
        else if(L.scene === 'tight') drawArmy(SCENE.since() / 90);
        else drawField(L);
    }
});
</script>
</body>
</html>
