<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Lake Trasimene: The Pursuit</title>
<style>
    body {
        margin: 0; padding: 0; background: #0e1114;
        height: 100vh; display: flex; align-items: center; justify-content: center;
        font-family: 'Courier New', Courier, monospace; overflow: hidden;
    }
    #stage {
        position: relative; width: 100%; max-width: 600px; 
        /* CHANGED: Made taller (3:4 ratio) so text doesn't hide the art */
        aspect-ratio: 3/4;
        background: #1a1f22; overflow: hidden;
        border: 1px solid #333;
        box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }
    
    /* DIALOGUE BOX */
    #dialogue-box {
        position: absolute; bottom: 0; left: 0;
        width: 100%; background: rgba(14, 17, 20, 0.95); 
        border-top: 2px solid #555;
        padding: 20px; display: none; z-index: 30;
        cursor: pointer; height: 140px; 
        box-sizing: border-box;
    }
    .speaker-name {
        color: #ef4444; font-weight: 900; font-size: 16px; text-transform: uppercase;
        margin-bottom: 10px; letter-spacing: 1px;
    }
    .speech-text {
        color: #e7e7ea; font-size: 18px; line-height: 1.4; white-space: pre-wrap;
    }
    
    .click-prompt {
        position: absolute; bottom: 10px; right: 20px;
        font-size: 12px; color: #f59e0b; animation: blink 1s infinite;
    }

    /* TITLE SCREEN */
    #title-screen {
        position: absolute; inset: 0; 
        background: rgba(200, 210, 220, 0.8); /* Foggy */
        display: none; flex-direction: column; align-items: center; justify-content: center;
        z-index: 50; text-align: center;
        opacity: 0; transition: opacity 2s;
    }
    h1 { 
        font-size: 56px; color: #b91c1c; margin: 0; 
        text-transform: uppercase; letter-spacing: 4px; 
        text-shadow: 0 2px 0 #000;
    }
    h2 { font-size: 18px; color: #111; margin-bottom: 30px; letter-spacing: 2px; font-weight:800; }
    
    button {
        background: #b91c1c; color: #fff; border: 4px solid #fff;
        padding: 15px 40px; font-size: 20px; font-weight: 900; cursor: pointer;
        text-transform: uppercase; 
        box-shadow: 0 4px 0 #7f1d1d;
    }
    button:active { transform: translateY(4px); box-shadow: none; }

    @keyframes blink { 50% { opacity: 0; } }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="boot.css">
</head>
<body>

<div id="stage">
    <canvas id="cv"></canvas>
    
    <div id="dialogue-box" onclick="nextLine()">
        <div class="speaker-name">Gaius Flaminius</div>
        <div class="speech-text" id="speech"></div>
        <div class="click-prompt">TAP TO CONTINUE ▼</div>
    </div>

    <div id="title-screen">
        <h1>TRASIMENE</h1>
        <h2>June, 217 BC</h2>
        <button onclick="window.location.href='trasimene_game.html'">Start March</button>
        <button onclick="window.location.href='map.html'" style="margin-top:15px; background:#475569; box-shadow:0 4px 0 #334155;">Back to Map</button>
    </div>
</div>

<script src="pixel.js"></script>
<script src="scene.js"></script>
<script>
const SCRIPT = [
    { scene: 'shore', mood: 'smug',  text: "The Senate writes to me. \"Wait for the other consul!\" \"Wait for the omens!\"" },
    { scene: 'shore', mood: 'angry', text: "Bah! Hannibal is right there! Hugging the lake shore like a frightened dog!" },
    { scene: 'shore', mood: 'smug',  text: "I do not need help to crush a retreating enemy." },
    { scene: 'march', mood: 'march', text: "Look at the mist... it masks our numbers perfectly." },
    { scene: 'march', mood: 'march', text: "Double time! We catch his rearguard before they leave the valley!" },
    { scene: 'shore', mood: 'yell',  text: "VICTORY IS OURS! MARCH!" }
];

// Flaminius on the misty shore of Lake Trasimene at dawn, his column in the distance
function drawShore(mood){
    SCENE.sky([[0,'#5a6a7c'],[24,'#7a8a98'],[46,'#a4aeb4'],[62,'#c8ccc8']]);
    SCENE.water(66, 94, '#3a5a78', '#8aa8c0');
    // the wooded hills come down to the water on the left
    SCENE.hills(84, [52,50,46,40,32,24,16,10,6,4,2,0,0,0,0,0,0], '#22402c', '#2e5238');
    for(let i=0; i<26; i++){ const x = (i*13) % 60, y = 40 + (i*7) % 40; if(y > 84 - [52,50,46,40,32,24,16,10][Math.floor(x/8)]) SCENE.rect(x, y, 3, 2, '#1a3422'); }
    // the shore road and the column, far off
    SCENE.rect(40, 84, 88, 3, '#8a7a5a');
    const t = PX.t;
    for(let i=0; i<14; i++){ const x = 126 - ((t*0.15 + i*7) % 92); SCENE.rect(x, 81, 2, 3, '#a02820'); SCENE.px(x, 80, '#c8ced6'); }
    SCENE.mist(56, 30, 0.6);
    SCENE.mist(90, 24, 0.4);
    SCENE.portrait('flaminius', mood);
}

// The column marches two abreast along the shore road, deep into the mist
function drawMarch(){
    PX.ground(16, 20, (x, y) => x <= 4 ? 'woodsHigh' : x <= 8 ? 'woods' : x <= 10 ? 'road' : 'lake');
    const t = PX.t, men = [];
    for(let r=0; r<14; r++) for(const c of [0, 1]){
        men.push({ x: 72 + c*9, y: 166 - ((t*0.3 + r*13) % 182), c });
    }
    men.sort((a, b) => a.y - b.y);
    for(const m of men) PX.figure('roman', m.x, m.y, { back:true, frame: Math.floor((t + m.c*6)/10) % 2 });
    // something glints among the trees
    const r = SCENE.rand(Math.floor(t/150) + 3);
    const gx = 6 + Math.floor(r()*56), gy = 10 + Math.floor(r()*140);
    if(t % 150 < 8) SCENE.px(gx, gy, '#fde68a');
    // mist, thickest over the road and the water
    const g = SCENE.ctx;
    for(let x=40; x<128; x+=2){
        const a = Math.min(0.62, (x - 40) / 120 + 0.1 + Math.sin((t/50) + x/14)*0.06);
        g.fillStyle = `rgba(214,222,228,${a.toFixed(3)})`; g.fillRect(x, 0, 2, 160);
    }
    SCENE.mist(30, 40, 0.35); SCENE.mist(100, 40, 0.3);
}

SCENE.run({
    script: SCRIPT,
    speakers: { flaminius: { label: 'Gaius Flaminius', color: '#ef4444' } },
    speaker: 'flaminius',
    draw: (L) => L.scene === 'march' ? drawMarch() : drawShore(L.mood)
});
</script>
</body>
</html>
